<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
   * A deep blue-black ground, signal amber for anything that needs the owner's
   * hand, a stable hue per lane. This file has no clusters or hues of its own
   * (see buildSectors/hashHue in the script), so both are derived at runtime
   * from whatever the API actually returns.
   */
  :root{
    color-scheme: dark;
    --bg: #0a0f1c;
    --panel: #0f1626;
    --panel-2: #151d32;
    --panel-3: #1b2540;
    --line: #27324f;
    --line-soft: #1d2740;
    --ink: #e9edf6;
    --ink-dim: #9ba6bf;
    --ink-faint: #7b86a3;
    --accent: #f0a41f;
    --accent-bright: #ffb52e;
    --accent-ink: #241804;
    --accent-soft: rgba(240, 164, 31, 0.14);
    --accent-dim: rgba(240, 164, 31, 0.4);
    --ok: #3ecf8e;
    --ok-soft: rgba(62, 207, 142, 0.13);
    --hot: #ff6d6d;
    --hot-soft: rgba(255, 109, 109, 0.13);
    --warn: #e6b455;
    --warn-soft: rgba(230, 180, 85, 0.12);
    --radius: 12px;
    --shadow-raise: 0 2px 6px #02061059, 0 10px 28px #0206104d;
    /* The Mission Control type system: Archivo for display, IBM Plex Sans for
       body, IBM Plex Mono for timestamps and ids. Same as the reference. */
    --font: "IBM Plex Sans", "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --display: "Archivo", var(--font);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  body{
    min-height: 100vh;
    overflow-x: hidden;
    background-image: radial-gradient(ellipse 75% 45% at 50% -8%, rgba(240,164,31,0.05), transparent 68%);
  }
  ::selection{ background: var(--accent); color: var(--accent-ink); }
  button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  a{ color: var(--accent-bright); }
  label{ display:block; font-size: 12px; color: var(--ink-dim); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], textarea, select{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--ink);
    width: 100%;
  }
  textarea{ resize: vertical; min-height: 60px; }
  input[type=checkbox]{ width: auto; accent-color: var(--accent); }
  h1,h2,h3,h4{ margin: 0 0 8px 0; font-weight: 600; }
  code, pre{ font-family: var(--mono); }
  pre{
    background: var(--bg);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 10px;
    overflow: auto;
    max-width: 100%;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    color: var(--ink-dim);
  }

  /* ---------- gate (sign-in) ---------- */
  .gate{ min-height: 100vh; width:100%; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .gate-card{
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 34px 32px;
    text-align: center;
    box-shadow: 0 1px 0 rgba(233,237,246,0.04) inset, 0 30px 80px rgba(2,6,16,0.6);
  }
  .gate-mark{
    width: 38px; height: 38px; margin: 0 auto 20px;
    border-radius: 10px; border: 2px solid var(--accent);
    position: relative; transform: rotate(45deg);
    box-shadow: 0 0 0 6px var(--accent-soft);
  }
  .gate-mark::after{ content:""; position:absolute; inset:9px; border-radius:3px; background:var(--accent); }
  .gate-card h1{
    margin:0; font-family: var(--display); font-size: 18px; font-weight: 700;
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .gate-sub{ margin: 8px 0 18px; font-size: 13px; color: var(--ink-faint); }
  .gate-err{
    text-align:left; background: var(--hot-soft); border: 1px solid var(--hot); color: #ffb4a3;
    border-radius: 8px; padding: 8px 10px; font-size: 12px; margin: 0 0 16px;
  }
  .gate-card .field{ text-align:left; margin-bottom: 4px; }
  .demo-tokens{ margin-top: 14px; display:flex; flex-direction:column; gap:6px; text-align:left; }
  .demo-token-btn{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; width:100%; text-align:left; color: var(--ink);
  }
  .demo-token-btn:hover{ background: var(--panel-3); border-color: var(--accent-dim); }
  .demo-token-btn .fleet-id{ color: var(--ink-faint); font-family: var(--mono); font-size: 11px; }

  /* ---------- shared controls ---------- */
  .btn{
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 8px; padding: 9px 16px; font-weight: 650;
  }
  .btn:hover{ background: var(--accent-bright); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .ghost, .btn-ghost{
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; transition: color .15s ease, border-color .15s ease;
  }
  .ghost:hover, .btn-ghost:hover{ color: var(--ink); border-color: var(--ink-faint); }
  .btn-danger{ border-color: var(--hot); color: #ffb4a3; }
  .btn-sm{ padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row-between{ display:flex; justify-content:space-between; align-items:center; gap:8px; }

  /* ---------- board shell ---------- */
  .board{ padding: 22px 24px 60px; max-width: 1900px; margin: 0 auto; }

  /* ---------- .top (ported) ---------- */
  .top{
    display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between;
    padding-bottom: 16px; border-bottom: 1px solid var(--line-soft);
  }
  .top h1{
    margin:0; font-family: var(--display); font-size: 19px; font-weight:700;
    letter-spacing: .1em; text-transform: uppercase; display:flex; align-items:center; gap:10px;
  }
  .top h1::before{
    content:""; width:9px; height:9px; border-radius:2px; background:var(--accent);
    transform: rotate(45deg); box-shadow: 0 0 0 4px var(--accent-soft);
    animation: ping 3s ease-in-out infinite;
  }
  @keyframes ping{
    0%,100%{ box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 0 rgba(240,164,31,.35); }
    60%{ box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 11px rgba(240,164,31,0); }
  }
  .asof{ margin: 6px 0 0; font-size: 12px; font-family: var(--mono); color: var(--ink-faint); }
  .top-stats{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .stat{
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 14px;
    padding: 9px 16px; display:flex; align-items:baseline; gap:9px; box-shadow: var(--shadow-raise);
  }
  .stat b{ font-size: 21px; font-family: var(--display); font-weight:700; font-variant-numeric: tabular-nums; letter-spacing:.01em; }
  .stat span{ font-size: 12px; color: var(--ink-dim); }
  .stat.hot{ border-color: rgba(255,109,109,.45); background: linear-gradient(180deg, var(--hot-soft), var(--panel)); }
  .stat.hot b{ color: var(--hot); }
  .stat.warn{ border-color: rgba(230,180,85,.4); background: linear-gradient(180deg, var(--warn-soft), var(--panel)); }
  .stat.warn b{ color: var(--warn); }
  .warn-tag{ color: var(--warn); }
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin: 14px 0 0; padding: 10px 14px; border-radius: 8px;
    background: var(--hot-soft); border: 1px solid rgba(255,109,109,.4); color: #ffa3a3; font-size: 12.5px;
  }
  .banner button{ background:none; border:1px solid rgba(255,109,109,.5); color:#ffa3a3; border-radius:6px; padding:3px 9px; font-size:11.5px; }

  /* ---------- .views (ported) ---------- */
  .views{ display:flex; gap:4px; margin-top:14px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
  .views button{
    background:transparent; border:none; border-bottom:2px solid transparent; color:var(--ink-faint);
    padding: 10px 14px; font-size:13px; display:inline-flex; align-items:center; gap:7px;
    margin-bottom:-1px; transition: color .15s ease;
  }
  .views button:hover{ color: var(--ink-dim); }
  .views button.on{ color: var(--ink); border-bottom-color: var(--accent); font-weight:600; }
  .badge{
    font-style:normal; font-size:10.5px; font-weight:650; font-family:var(--mono);
    background: var(--accent); color: var(--accent-ink); border-radius:999px; padding:1px 7px;
    font-variant-numeric: tabular-nums; animation: signal 2.4s ease-in-out infinite;
  }
  @keyframes signal{
    0%,100%{ box-shadow: 0 0 0 0 rgba(240,164,31,.45); }
    50%{ box-shadow: 0 0 0 5px rgba(240,164,31,0); }
  }
  .badge.muted{ background: var(--line); color: var(--ink-dim); animation:none; }

  /* ---------- .hint (ported) ---------- */
  .hint{ font-size: 10.5px; line-height:1.45; color: var(--ink-faint); }

  /* ---------- errors / toasts ---------- */
  #errors{ position: fixed; top: 16px; right: 16px; z-index: 500; display:flex; flex-direction:column; gap:8px; max-width: 380px; }
  .toast{
    background: var(--hot-soft); border: 1px solid var(--hot); color: #ffcfc2; border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; display:flex; justify-content:space-between; gap:10px;
    align-items:flex-start; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  .toast button{ background:none; border:none; color:#ffcfc2; font-size:14px; line-height:1; padding:0 2px; }

  /* ---------- chips ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:4px; border-radius:100px; padding:2px 9px;
    font-size:11px; font-weight:600; border:1px solid transparent; white-space:nowrap;
  }
  .chip-green{ background: var(--ok-soft); color:#8fe0b3; border-color:rgba(62,207,142,.4); }
  .chip-amber{ background: var(--warn-soft); color:#f0cd85; border-color:rgba(230,180,85,.4); }
  .chip-red{ background: var(--hot-soft); color:#ffb4a3; border-color:rgba(255,109,109,.4); }
  .chip-neutral{ background: var(--panel-2); color: var(--ink-dim); border-color: var(--line); }

  /* ---------- cards / lists ---------- */
  .card{ background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-raise); }
  .card h3{ font-size:14px; }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-faint); margin: 4px 0 8px; }
  .scroll-x{ overflow-x:auto; max-width:100%; }
  table{ border-collapse: collapse; width:100%; font-size:12.5px; }
  th, td{ text-align:left; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th{ color: var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.wrap{ white-space: normal; }
  .view-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin: 18px 0 16px; flex-wrap:wrap; }
  .view-header h2{ font-size: 22px; font-family: var(--display); font-weight:700; letter-spacing: .01em; }
  .view-sub{ color: var(--ink-faint); font-size: 12.5px; margin-top:3px; }

  /* ---------- board ---------- */
  .board-layout{ display:flex; gap:18px; align-items:flex-start; }
  .board-list{ width: 320px; flex: none; display:flex; flex-direction:column; gap:8px; }
  .board-detail{ flex:1; min-width:0; }
  .filters{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .filter-btn{
    background: var(--panel-2); border:1px solid var(--line); border-radius: 100px;
    padding: 4px 11px; font-size: 11.5px; color: var(--ink-dim);
  }
  .filter-btn:hover{ background: var(--panel-3); }
  .filter-btn.active{ background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent-bright); }
  .item-card{
    background: var(--panel); border:1px solid var(--line-soft); border-radius:8px;
    padding: 11px 12px; cursor:pointer; text-align:left; width:100%;
  }
  .item-card:hover{ border-color: var(--accent-dim); }
  .item-card.selected{ border-color: var(--accent); background: var(--panel-2); }
  .item-card .item-title{ font-weight:600; font-size:13px; margin-bottom:4px; }
  .item-card .item-meta{ display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--ink-faint); }
  .waiting-badge{
    display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--accent);
    box-shadow: 0 0 6px var(--accent); margin-right:5px;
  }

  .thread{ display:flex; flex-direction:column; gap:10px; margin: 12px 0; }
  .thread-entry{ display:flex; gap:10px; }
  .thread-avatar{
    width: 26px; height: 26px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .thread-entry.owner .thread-avatar{ background: var(--accent-soft); color: var(--accent-bright); border:1px solid var(--accent-dim); }
  .thread-entry.agent .thread-avatar{ background: hsl(var(--hue, 200) 45% 16%); color: hsl(var(--hue, 200) 62% 74%); border:1px solid hsl(var(--hue, 200) 45% 38%); }
  .thread-entry.system .thread-avatar, .thread-entry.platform .thread-avatar{ background: var(--panel-2); color: var(--ink-faint); border:1px solid var(--line); }
  .thread-body{ flex:1; min-width:0; }
  .thread-head{ display:flex; gap:8px; align-items:baseline; font-size:12px; margin-bottom:2px; flex-wrap:wrap; }
  .thread-who{ font-weight:600; }
  .thread-role{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:100px; }
  .thread-entry.owner .thread-role{ background: var(--accent-soft); color: var(--accent-bright); }
  .thread-entry.agent .thread-role{ background: hsl(var(--hue, 200) 45% 16%); color: hsl(var(--hue, 200) 62% 74%); }
  .thread-entry.system .thread-role, .thread-entry.platform .thread-role{ background: var(--panel-2); color: var(--ink-faint); }
  .thread-time{ color: var(--ink-faint); font-size:11px; margin-left:auto; }
  .thread-text{ font-size: 13px; color: var(--ink); }
  .thread-kind{ font-size:11px; color: var(--ink-faint); margin-top:2px; }

  .scope-beat{
    border: 1.5px solid var(--accent-dim);
    background: linear-gradient(180deg, var(--accent-soft), var(--panel-2));
    border-radius: 10px; padding: 14px; margin: 12px 0;
  }
  .scope-beat .scope-label{ font-size: 16px; font-weight:700; color: var(--accent-bright); }
  .scope-beat .scope-basis{ font-size:12.5px; color: var(--ink-dim); margin-top:4px; }
  .scope-overrule{
    margin-top: 10px; background: var(--hot-soft); border: 1px solid var(--hot);
    border-radius: 8px; padding: 9px 11px; font-size: 12.5px; color: #ffcdbf;
  }
  .scope-overrule b{ color: #ffb4a3; }

  .kv{ display:grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin: 8px 0; }
  .kv dt{ color: var(--ink-faint); }
  .kv dd{ margin:0; }

  .form-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .form-grid .full{ grid-column: 1 / -1; }
  .field{ margin-bottom: 4px; }

  .empty-state{ color: var(--ink-faint); font-size:13px; padding: 24px 0; text-align:center; }

  .answer-card{
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 13px 14px; margin-bottom: 10px; cursor:pointer;
  }
  .answer-card:hover{ border-color: var(--accent-dim); }
  .answer-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .answer-value{ font-size: 16px; font-weight:700; margin: 6px 0 4px; }
  .answer-meta{ font-size:11.5px; color: var(--ink-faint); }
  .conflict-banner{
    background: var(--warn-soft); border:1px solid var(--warn); color:#f6dca3;
    border-radius:8px; padding: 11px 13px; margin-bottom:14px; font-size:13px;
  }
  .unverified-flag{
    background: var(--hot-soft); border:1px solid var(--hot); color:#ffcdbf;
    border-radius:6px; padding:6px 9px; font-size:12px; margin-top:8px;
  }

  .refusal-card{
    background: var(--hot-soft); border:1px solid var(--hot); border-radius:8px;
    padding: 11px 13px; font-size: 13px; color:#ffcdbf; margin-top: 10px;
  }
  .refusal-stage{ font-family: var(--mono); font-size:11px; color:#ffb4a3; }
  .approval-box{ background: var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:8px; }

  .connection-box{ background: var(--bg); border:1px solid var(--line-soft); border-radius:8px; padding:12px; position:relative; }
  .copy-btn{ position:absolute; top:8px; right:8px; }

  .queue-row{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .queue-card{
    background: var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding: 12px 18px; text-align:left; min-width:190px;
  }
  .queue-card:hover{ border-color: var(--accent-dim); }
  .queue-card.active{ border-color: var(--accent); background: var(--accent-soft); }
  .queue-card .queue-count{ font-size:22px; font-weight:700; line-height:1.2; }
  .queue-card .queue-label{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  .board-columns{ display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; width:100%; }
  .board-column{
    background: var(--panel); border:1px solid var(--line-soft); border-radius:10px;
    width: 270px; flex: none; display:flex; flex-direction:column; max-height: 66vh;
  }
  .board-column-head{
    padding: 9px 12px; border-bottom:1px solid var(--line-soft); font-weight:600; font-size:12.5px;
    display:flex; justify-content:space-between; align-items:center; flex:none;
  }
  .board-column-body{ overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; }
  .badge-count{
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 1px 7px; font-size: 11px; color: var(--ink-dim);
  }

  /* ---------- org view ---------- */
  .org-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .org-card{ background: var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:14px; }
  .org-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft); gap:10px; }
  .org-row:last-child{ border-bottom:none; }
  .org-name{ font-weight:600; font-size:13px; }
  .org-role{ font-size:11px; color:var(--ink-faint); margin-top:2px; }

  /* ---------- deck (ported from Deck.tsx / globals.css) ---------- */
  .deck{
    display:grid; grid-template-columns: minmax(210px,290px) minmax(320px,1fr) minmax(220px,300px);
    gap:16px; align-items:start; padding: 18px 0 8px;
  }
  .deck-side{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .deck-panel{
    background: rgba(15,22,38,.72); backdrop-filter: blur(8px);
    border: 1px solid var(--line-soft); border-radius: 12px; padding: 13px 14px; min-width:0; overflow:hidden;
  }
  .deck-panel h3{ margin:0 0 10px; font-size:10.5px; font-weight:650; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
  .deck-nums{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .deck-nums > div{ display:flex; align-items:baseline; gap:7px; }
  .deck-nums b{ font-family: var(--mono); font-size:19px; font-weight:600; font-variant-numeric: tabular-nums; }
  .deck-nums span{ font-size:10.5px; color:var(--ink-faint); }
  .deck-nums .hot b{ color: var(--hot); }
  .deck-nums .amber b{ color: var(--accent-bright); }
  .deck-dot{ flex:0 0 auto; width:7px; height:7px; border-radius:2px; background: hsl(var(--hue) 62% 58%); }

  .deck-signal{
    --hue: 180; display:block; width:100%; max-width:100%; min-width:0; overflow:hidden; text-align:left;
    background:transparent; border:none; border-bottom:1px solid var(--line-soft); padding:8px 2px;
    transition: background .15s ease;
  }
  .deck-signal:last-of-type{ border-bottom:none; }
  .deck-signal:hover{ background: rgba(233,237,246,.04); }
  .deck-signal-top{ display:flex; align-items:center; gap:7px; font-size:10px; color:var(--ink-faint); }
  .deck-signal-top b{ font-weight:600; color:var(--ink-dim); }
  .deck-signal-top em.ts{ margin-left:auto; font-size:9.5px; font-style:normal; }
  .deck-signal-body{
    display:block; margin:4px 0 0 14px; font-size:11.5px; line-height:1.45; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .deck-agent{
    --hue: 180; --period: 12s; display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:transparent; border:none; border-bottom:1px solid var(--line-soft); padding:8px 2px;
    transition: background .15s ease; animation: node-lift var(--period) linear infinite; animation-delay: var(--flare, 0s);
  }
  .deck-agent:last-of-type{ border-bottom:none; }
  .deck-agent:hover{ background: rgba(233,237,246,.04); }
  .deck-agent-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .deck-agent-main b{ font-size:12px; font-weight:600; color:var(--ink); }
  .deck-agent-main span{ font-size:10px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck-agent-state{ flex:0 0 auto; font-style:normal; font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); font-variant-numeric: tabular-nums; }
  .deck-agent-state.live{ color: hsl(var(--hue) 55% 68%); }
  .deck-agent-state.amber{ color: var(--accent-bright); }

  .deck-group + .deck-group{ margin-top:9px; }
  .deck-group-name{
    display:flex; align-items:center; gap:6px; margin:0 0 2px; padding-top:9px; border-top:1px solid var(--line-soft);
    font-family: var(--mono); font-size:8.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color: hsl(var(--hue) 40% 72%);
  }
  .deck-group:first-of-type .deck-group-name{ border-top:none; padding-top:0; }
  .deck-group-name i{ flex:0 0 auto; width:5px; height:5px; border-radius:1px; background: hsl(var(--hue) 62% 58%); box-shadow: 0 0 6px hsl(var(--hue) 62% 58% / .7); }
  .deck-group .deck-agent:last-of-type{ border-bottom:none; }

  .deck-stage{
    position:relative; width:100%; max-width: min(74vh, 760px); aspect-ratio:1; margin:0 auto; justify-self:center;
    background: radial-gradient(circle at 50% 50%, rgba(240,164,31,.045), rgba(15,22,38,.25) 45%, transparent 72%);
    border-radius:50%;
  }
  .deck-space{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .deck-field{
    position:absolute; top:-2px; left:50%; transform:translateX(-50%); z-index:3; display:flex; align-items:center; gap:8px;
    margin:0; padding:6px 14px; border-radius:999px; border:1px solid var(--line-soft); background: rgba(15,22,38,.8);
    backdrop-filter: blur(8px); font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color: var(--ink-dim); white-space:nowrap;
  }
  .deck-field i{ width:7px; height:7px; border-radius:50%; }
  .deck-field.ok i{ background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .deck-field.amber i{ background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: signal 2.4s ease-in-out infinite; }
  .deck-field.hot i{ background: var(--hot); box-shadow: 0 0 8px var(--hot); animation: signal 1.6s ease-in-out infinite; }

  .deck-ring{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; border:1px solid rgba(39,50,79,.85); pointer-events:none; }
  .deck-ring.r1{ width:34%; height:34%; }
  .deck-ring.r2{ width:60%; height:60%; }
  .deck-ring.r3{ width:86%; height:86%; border-color: rgba(39,50,79,.55); }
  .deck-ring.spin{ width:73%; height:73%; border:1px dashed rgba(240,164,31,.2); animation: deck-spin 48s linear infinite; }
  @keyframes deck-spin{ to{ transform: translate(-50%,-50%) rotate(360deg); } }

  .deck-sector{
    position:absolute; left:50%; top:50%; width:88%; height:88%; transform:translate(-50%,-50%); border-radius:50%;
    pointer-events:none; z-index:0;
    background: conic-gradient(from calc(var(--a0) * 1deg),
      hsl(var(--hue) 64% 56% / .22), hsl(var(--hue) 64% 56% / .07) calc(var(--span) * 0.5deg),
      hsl(var(--hue) 64% 56% / .18) calc(var(--span) * 1deg), transparent 0);
    -webkit-mask-image: radial-gradient(circle, transparent 47%, #000 57%, #000 95%, transparent 100%);
    mask-image: radial-gradient(circle, transparent 47%, #000 57%, #000 95%, transparent 100%);
    opacity:.6; animation: sector-wash var(--period, 12s) linear infinite; animation-delay: var(--flare, 0s);
  }
  @keyframes sector-wash{ 0%,100%{opacity:.6;} 5%{opacity:1;} 26%{opacity:.6;} }

  .deck-sector-name{
    position:absolute; transform:translate(-50%,-50%); z-index:2; padding:3px 9px; border-radius:999px;
    border:1px solid hsl(var(--hue) 45% 52% / .35); background: hsl(var(--hue) 42% 11% / .78); backdrop-filter: blur(4px);
    font-family: var(--mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color: hsl(var(--hue) 46% 78%);
    white-space:nowrap; pointer-events:none; animation: sector-name-wash var(--period, 12s) linear infinite; animation-delay: var(--flare, 0s);
  }
  @keyframes sector-name-wash{
    0%,100%{ border-color: hsl(var(--hue) 45% 52% / .35); box-shadow:none; }
    5%{ border-color: hsl(var(--hue) 62% 64% / .9); box-shadow: 0 0 14px hsl(var(--hue) 62% 55% / .32); }
    26%{ border-color: hsl(var(--hue) 45% 52% / .35); box-shadow:none; }
  }

  .deck-lines{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; overflow:visible; }
  .deck-edge{ stroke: rgba(46,59,92,.85); stroke-width:.16; stroke-dasharray: 1 2.2; }
  .deck-link{ stroke: hsl(var(--hue) 60% 62% / .55); stroke-width:.3; stroke-dasharray: 1.4 1.3; animation: link-flow 2.6s linear infinite; }
  @keyframes link-flow{ to{ stroke-dashoffset: -5.4; } }

  .deck-sweep{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:88%; height:88%; border-radius:50%;
    background: conic-gradient(from 0deg, rgba(240,164,31,.2), rgba(240,164,31,.07) 26deg, rgba(240,164,31,.02) 52deg, transparent 76deg);
    -webkit-mask-image: radial-gradient(circle, transparent 26%, #000 40%);
    mask-image: radial-gradient(circle, transparent 26%, #000 40%);
    animation: deck-spin var(--period, 12s) linear infinite; pointer-events:none; z-index:1;
  }

  .deck-node{
    position:absolute; transform:translate(-50%,-50%); z-index:2; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; padding:6px; color:var(--ink);
    animation: node-lift var(--period, 12s) linear infinite; animation-delay: var(--flare, 0s);
  }
  .deck-node-dot{
    position:relative; width:10px; height:10px; border-radius:3px; background: hsl(var(--hue) 62% 58%);
    box-shadow: 0 0 10px hsl(var(--hue) 62% 58% / .7); transition: transform .15s ease;
  }
  .deck-node-dot::after{
    content:""; position:absolute; inset:-7px; border-radius:50%;
    background: radial-gradient(circle, hsl(var(--hue) 72% 64% / .9), hsl(var(--hue) 72% 64% / .25) 45%, transparent 72%);
    opacity:0; animation: dot-flare var(--period, 12s) linear infinite; animation-delay: var(--flare, 0s); pointer-events:none;
  }
  @keyframes dot-flare{
    0%{opacity:0; transform:scale(.5);} 4%{opacity:1; transform:scale(1.25);}
    20%{opacity:0; transform:scale(.5);} 100%{opacity:0; transform:scale(.5);}
  }
  @keyframes node-lift{ 0%,100%{ filter:brightness(1);} 4%{ filter:brightness(1.85);} 22%{ filter:brightness(1);} }
  .deck-node.busy .deck-node-dot{ animation: node-pulse 2.6s ease-in-out infinite; }
  @keyframes node-pulse{ 0%,100%{ box-shadow: 0 0 10px hsl(var(--hue) 62% 58% / .7);} 50%{ box-shadow: 0 0 16px hsl(var(--hue) 62% 58% / 1);} }
  .deck-node:hover .deck-node-dot{ transform: scale(1.35); }
  .deck-node-name{ font-size:11px; font-weight:600; white-space:nowrap; text-shadow: 0 1px 5px rgba(8,12,22,.95), 0 0 2px rgba(8,12,22,.9); transition: color .15s ease; }
  .deck-node:hover .deck-node-name{ color: hsl(var(--hue) 60% 76%); }
  .deck-node-sub{ font-family: var(--mono); font-size:9px; color: var(--ink-faint); white-space:nowrap; text-shadow: 0 1px 5px rgba(8,12,22,.95); font-variant-numeric: tabular-nums; }

  .deck-core{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; width:26%; aspect-ratio:1; border-radius:50%;
    border: 1px solid rgba(240,164,31,.35);
    background: radial-gradient(circle at 50% 42%, rgba(240,164,31,.16), rgba(15,22,38,.9) 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--ink);
    transition: border-color .15s ease;
  }
  .deck-core:hover{ border-color: var(--accent); }
  .deck-core-glow{ position:absolute; inset:-1px; border-radius:50%; pointer-events:none; animation: core-breathe 4.5s ease-in-out infinite; }
  @keyframes core-breathe{ 0%,100%{ box-shadow: 0 0 0 0 rgba(240,164,31,.22);} 50%{ box-shadow: 0 0 34px 6px rgba(240,164,31,.1);} }
  .deck-core-ring{ position:absolute; inset:-9px; border-radius:50%; border:1px dashed rgba(240,164,31,.45); pointer-events:none; animation: core-ring-spin 22s linear infinite; }
  @keyframes core-ring-spin{ to{ transform: rotate(-360deg); } }
  .deck-core-name{ font-family: var(--display); font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .deck-core-sub{ font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--accent-bright); }
  .deck-core-load{ margin-top:3px; font-family: var(--mono); font-size:9.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  @media (max-width: 880px){
    .deck{ grid-template-columns: 1fr; }
    .deck-stage{ order:-1; max-width: min(92vw, 620px); }
    .deck-sector-name{ font-size:7.5px; padding:2px 6px; letter-spacing:.1em; }
    .deck-node-name{ font-size:10.5px; }
    .deck-side{ flex-direction:row; flex-wrap:wrap; }
    .deck-side .deck-panel{ flex: 1 1 300px; }
    .board-layout{ flex-direction:column; }
    .board-list{ width:100%; }
    .board-column{ width:100%; max-height:50vh; }
    .form-grid{ grid-template-columns: 1fr; }
  }

  /* Motion is state, not decoration here: honour the user's reduced-motion
     preference by dropping the sweep, the spin, the flares and the particle
     field entirely rather than merely slowing them. */
  @media (prefers-reduced-motion: reduce){
    .top h1::before, .badge, .deck-field.amber i, .deck-field.hot i,
    .deck-ring.spin, .deck-sweep, .deck-sector, .deck-sector-name,
    .deck-node, .deck-node-dot::after, .deck-node.busy .deck-node-dot,
    .deck-agent, .deck-link{
      animation: none !important;
    }
  }

  /* ======================================================================
     v2 — Jira board, org chart, agent pop-up. Clearer, calmer, easier to read.
     ====================================================================== */

  /* the state badge every agent carries, one vocabulary everywhere */
  .state-pill{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
    border:1px solid transparent;
  }
  .state-pill::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st-now{ color:var(--ok); background:var(--ok-soft); border-color:rgba(62,207,142,.28); }
  .st-wait{ color:var(--accent-bright); background:var(--accent-soft); border-color:var(--accent-dim); }
  .st-blocked{ color:var(--hot); background:var(--hot-soft); border-color:rgba(255,109,109,.3); }
  .st-idle{ color:var(--ink-faint); background:rgba(155,166,191,.1); border-color:var(--line); }

  /* status dot palette, shared by the legend, the swimlane header and the pop-up */
  .am-task-dot, .swim-legend-item > .am-task-dot{ width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
  .d-now{ background:var(--ok); } .d-blocked{ background:var(--hot); }
  .d-wait{ background:var(--accent-bright); } .d-parked{ background:var(--ink-faint); }
  .d-done{ background:#5b6b8f; } .d-idle{ background:var(--line); }

  /* ---- the legend above the board ---- */
  .swim-legend{ display:flex; flex-wrap:wrap; gap:16px; margin:2px 0 12px; padding:0 2px; }
  .swim-legend-item{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-dim); }

  /* ---- the Jira swimlane board ---- */
  .swimboard-scroll{ overflow-x:auto; padding-bottom:6px; }
  .swimboard{ min-width:640px; border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; background:var(--panel); box-shadow:var(--shadow-raise); }
  .swim-corner, .swim-colhead span:first-child{ font-family:var(--display); }
  .swim-row{ display:grid; align-items:stretch; border-top:1px solid var(--line-soft); }
  .swim-row:first-child{ border-top:0; }
  .swim-head{ position:sticky; top:0; background:var(--panel-2); z-index:2; }
  .swim-corner{ display:flex; align-items:center; padding:11px 14px; font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-faint); font-weight:700; }
  .swim-colhead{ display:flex; align-items:center; gap:8px; padding:11px 14px; font-size:12px; font-weight:600;
    color:var(--ink-dim); border-left:1px solid var(--line-soft); }
  .swim-lane{ display:flex; align-items:center; gap:10px; text-align:left; width:100%;
    padding:12px 14px; background:var(--panel-2); border:0; border-right:1px solid var(--line-soft);
    color:var(--ink); transition:background .12s; }
  button.swim-lane{ cursor:pointer; }
  button.swim-lane:hover{ background:var(--panel-3); }
  .swim-lane-static{ cursor:default; }
  .swim-avatar{ width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:13px; color:#fff; text-transform:uppercase; }
  .swim-lane-body{ min-width:0; flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
  .swim-lane-name{ font-weight:600; font-size:14px; font-family:var(--display); }
  .swim-lane-role{ font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .swim-lane .state-pill{ margin-top:1px; }
  .swim-cell{ padding:8px; border-left:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px;
    background:repeating-linear-gradient(-45deg, transparent, transparent 9px, rgba(255,255,255,.008) 9px, rgba(255,255,255,.008) 10px); }

  /* cards sit in the cells; a touch lighter than before */
  .swim-cell .item-card{ width:100%; }

  /* ---- the org chart ---- */
  .orgchart{ display:flex; flex-direction:column; align-items:center; padding:14px 8px 28px; }
  .orgc-level{ display:flex; justify-content:center; }
  .orgc-connector{ width:2px; height:26px; background:var(--line); }
  .orgc-children{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; position:relative; padding-top:26px; }
  .orgc-children::before{ content:''; position:absolute; top:0; left:12%; right:12%; height:2px; background:var(--line); }
  .orgc-child{ position:relative; }
  .orgc-child::before{ content:''; position:absolute; top:-26px; left:50%; width:2px; height:26px; background:var(--line); }
  .orgc-node{ display:flex; align-items:center; gap:11px; text-align:left; min-width:210px; max-width:280px;
    padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); box-shadow:var(--shadow-raise); }
  button.orgc-node{ cursor:pointer; transition:border-color .12s, transform .12s, background .12s; }
  button.orgc-node:hover{ border-color:var(--accent-dim); background:var(--panel-3); transform:translateY(-1px); }
  button.orgc-node:disabled{ cursor:default; }
  .orgc-owner{ background:linear-gradient(180deg, var(--panel-3), var(--panel-2)); border-color:var(--accent-dim); }
  .orgc-orch{ border-color:rgba(240,164,31,.35); }
  .orgc-avatar{ width:34px; height:34px; border-radius:9px; flex:none; display:flex; align-items:center;
    justify-content:center; font-weight:700; color:#fff; text-transform:uppercase; }
  .orgc-owner .orgc-avatar{ background:var(--accent); color:var(--accent-ink); }
  .orgc-owner .orgc-name{ color:var(--accent-bright); }
  .orgc-body{ flex:1; min-width:0; }
  .orgc-name{ font-weight:700; font-size:14.5px; font-family:var(--display); }
  .orgc-sub{ font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- the agent pop-up ---- */
  .am-card{ position:relative; width:min(480px, 100%); background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:20px; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .am-close{ position:absolute; top:12px; right:12px; width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink-dim); font-size:16px; line-height:1; }
  .am-close:hover{ color:var(--ink); border-color:var(--line); background:var(--panel-3); }
  .am-head{ display:flex; align-items:center; gap:12px; padding-right:32px; }
  .am-avatar{ width:44px; height:44px; border-radius:11px; flex:none; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:18px; color:#fff; text-transform:uppercase; }
  .am-id{ flex:1; min-width:0; }
  .am-name{ font-weight:700; font-size:17px; font-family:var(--display); display:flex; align-items:center; gap:8px; }
  .am-orch{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-bright);
    background:var(--accent-soft); border:1px solid var(--accent-dim); padding:2px 6px; border-radius:5px; }
  .am-role{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .am-meta{ display:flex; gap:10px; margin:16px 0; }
  .am-kv{ flex:1; background:var(--panel-2); border:1px solid var(--line-soft); border-radius:9px; padding:9px 11px; }
  .am-kv span{ display:block; font-size:11px; color:var(--ink-faint); }
  .am-kv b{ font-size:13.5px; font-weight:600; }
  .am-tasks{ display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow-y:auto; }
  .am-status{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:700; margin-top:8px; }

    background:var(--panel-2); border:1px solid var(--line-soft); border-radius:8px; color:var(--ink); }
  .am-task:hover{ border-color:var(--accent-dim); background:var(--panel-3); }
  .am-task-title{ flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .am-task-kind{ font-size:11px; color:var(--ink-faint); flex:none; }

<div id="app"></div>

<script>
(function(){
  'use strict';

  /* ---------------- state ---------------- */
  const state = {
    token: null,
    whoami: null,
    context: null,
    view: 'board',
    board: {
      items: [], waiting_on_you: [], waiting_on_agents: [], columns: {}, revision: null,
      selectedId: null, detail: null, detailLoading: null,
      queueFilter: null, laneFilter: null, historyOpen: false,
      archivedItems: [], archivedLoaded: false, archivedLoading: false,
    },
    consume: { kind: '', subject: '', agent: '', result: null, selectedOutput: null },
    catalog: { agent: '', items: [], invokeResult: null, invokeTarget: null, pendingApproval: null },
    grants: null,
    connection: null,
    devTokens: null,
    signinReason: null,
    proposeForm: { open: false, itemId: null },
  };

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, children){
    const n = document.createElement(tag);
    attrs = attrs || {};
    for (const k in attrs){
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
      // A boolean attribute is present or absent, never "false": setAttribute
      // would otherwise mark every option selected and the last one would win.
      else if (attrs[k] === false) continue;
      else if (attrs[k] === true) n.setAttribute(k, '');
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach((c) => { if (c === null || c === undefined) return; n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };

  // The board's last movement, read from the API. Falls back to the revision
  // only when a board has never been written, where there is no time to show.
  function reconciledAt(){
    const at = state.board.updated_at || (state.context && state.context.updated_at);
    if (at) {
      try { return new Date(at).toLocaleString(); } catch (e) { return at; }
    }
    const rev = state.board.revision != null ? state.board.revision : null;
    return rev != null ? 'rev ' + rev : 'not yet';
  }
  const fmtTime = (iso) => { try { return new Date(iso).toLocaleString(); } catch(e){ return iso; } };
  const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(); } catch(e){ return iso; } };
  const fmtShort = (iso) => { try { return new Date(iso).toLocaleString(undefined, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch(e){ return iso; } };
  const today = () => new Date().toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  function reduceMotion(){
    try { return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch(e){ return false; }

  function showError(reason){
    const box = document.getElementById('errors');
    const t = el('div', { class: 'toast' }, [
      el('span', {}, [reason || 'something went wrong']),
      el('button', { 'aria-label': 'dismiss', onclick: () => t.remove() }, ['×']),
    ]);
    box.appendChild(t);
    setTimeout(() => t.remove(), 12000);
  }

  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({ 'authorization': 'Bearer ' + state.token }, opts.headers || {});
    if (opts.body) headers['content-type'] = 'application/json';
    let res, data;
    try {
      res = await fetch(path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      data = await res.json();
    } catch (err) {
      showError('network error calling ' + path + ': ' + (err && err.message));
      return { ok: false, reason: 'network error', _status: 0 };
    }
    data._status = res.status;
    // A 403 is a normal answer in this system: off an access list, no live
    // grant, outside an output's scope, a write that needs a human. Those must
    // reach the caller with their stage intact, not end the session. Only a
    // dead token or a principal the host will not accept is a sign-out.
    const principalDead =
      res.status === 401 ||
      (res.status === 403 && /is not active|needs a fleet token|does not belong|is not registered$|is archived/.test(data.reason || ''));
    if (principalDead && !opts.allowAuthFail) {
      signOut(data.reason || 'request refused (' + res.status + ')');
      return data;
    }
    if (!data.ok && !opts.quiet) showError(data.reason || 'request failed');
    return data;
  }

  /* ---------------- auth / bootstrap ---------------- */
  function signOut(reason){
    try { sessionStorage.removeItem('ebt_token'); } catch(e){}
    state.token = null;
    state.whoami = null;
    state.context = null;
    state.signinReason = reason || null;
    render();
  }

  function tokenFromHash(){
    const h = location.hash || '';
    const m = h.match(/#token=([^&]+)/);
    if (!m) return null;
    const tok = decodeURIComponent(m[1]);
    try { sessionStorage.setItem('ebt_token', tok); } catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
    return tok;
  }

  async function boot(){
    let tok = tokenFromHash();
    if (!tok) { try { tok = sessionStorage.getItem('ebt_token'); } catch(e){ tok = null; } }
    if (!tok) { renderSignin(); return; }
    state.token = tok;
    const who = await api('/api/whoami', { allowAuthFail: true, quiet: true });
    if (!who.ok) {
      state.token = null;
      renderSignin(who.reason || 'sign-in required');
      return;
    }
    state.whoami = who;
    try { sessionStorage.setItem('ebt_token', tok); } catch(e){}
    // The board renders from state, so both loads have to land before the first
    // paint or the list comes up empty while the counts say otherwise.
    await refreshAll();
  }

  async function loadContext(){
    const ctx = await api('/api/fleet/context', { quiet: true });

      // fail on an empty selection.
      const first = (ctx.agents && ctx.agents[0] && ctx.agents[0].id) || '';
      if (!state.consume.agent) state.consume.agent = first;
      if (!state.catalog.agent) state.catalog.agent = first;

  /* ================= lanes / sectors / hue ================= */
  //
  // This repo's lane registry (F.board.laneRegistry()) carries only {name,
  // role} per lane: no clusters, no hues. The real Mission Control groups its
  // fleet into hand-authored spheres of influence with a fixed hue each; here
  // both are derived at runtime. A lane that does carry a `cluster` field is
  // grouped by it (a future registry could add one); otherwise every agent
  // lane falls into one sector, tagged "Fleet". The owner's own lane ("owner")
  // is never a sector member - it is the centre, not a node on the ring.

  function hashHue(str){
    let h = 2166136261;
    const s = String(str || '');
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return Math.abs(h) % 360;
  }
  function titleCase(s){
    return String(s || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
  }
  function agentLaneIds(){
    const lanes = (state.context && state.context.lanes) || {};
    return Object.keys(lanes).filter((id) => id !== 'owner');
  }
  function buildSectors(){
    const lanes = (state.context && state.context.lanes) || {};
    const ids = agentLaneIds();
    const order = [];
    const groups = new Map();
    ids.forEach((id) => {
      const meta = lanes[id] || {};
      const key = meta.cluster || '__fleet__';
      if (!groups.has(key)) { groups.set(key, []); order.push(key); }
      groups.get(key).push(id);
    });
    return order.map((key) => {
      if (key === '__fleet__') {
        return { id: 'fleet', tag: 'Fleet', name: 'Fleet', blurb: 'Every lane in this fleet.', hue: hashHue('fleet-sector'), members: groups.get(key) };
      }
      return { id: key, tag: titleCase(key), name: titleCase(key), blurb: 'Lanes grouped under ' + titleCase(key) + '.', hue: hashHue(key), members: groups.get(key) };
    });
  }

  /* --- deck geometry (ported from Deck.tsx) --- */
  const PERIOD = 12;
  const GAP = 6;
  const rad = (a) => (a * Math.PI) / 180;
  const roundV = (v) => Math.round(v * 1000) / 1000;
  const pxPos = (a, r) => roundV(50 + r * Math.cos(rad(a)) * 50);
  const pyPos = (a, r) => roundV(50 + r * Math.sin(rad(a)) * 50);
  const delayFor = (a) => roundV((((((a + 90) % 360) + 360) % 360) / 360) * PERIOD);

  function layoutDeck(sectors){
    const heads = sectors.reduce((n, c) => n + c.members.length, 0);
    if (!heads) return { sectors: [], nodes: [] };
    const per = (360 - GAP * sectors.length) / heads;
    let cursor = -90 + GAP / 2;
    const sectorPos = sectors.map((c) => {
      const span = c.members.length * per;
      const a0 = cursor;
      cursor += span + GAP;
      return { c, a0, span, mid: a0 + span / 2 };
    });
    const nodes = sectorPos.flatMap(({ c, a0, span }) => c.members.map((lane, i) => ({
      lane,
      cluster: c,
      a: a0 + (i + 0.5) * (span / c.members.length),
      r: i % 2 === 0 ? 0.68 : 0.58,
    })));
    return { sectors: sectorPos, nodes };
  }

  function laneStateMap(){
    const items = state.board.items || [];
    const byId = {};
    items.forEach((i) => { byId[i.id] = i; });
    // Only a real proposal (an entry id) counts as "for you" here - the same
    // filter Approvals and its tab badge use. "Waiting on you" also covers
    // acknowledging a platform team decision, which is not a verdict a lane
    // is owed credit or blame for.
    const wYou = (state.board.waiting_on_you || []).filter((w) => w.entry);
    const wAgents = state.board.waiting_on_agents || [];
    const forYou = {};
    wYou.forEach((w) => {
      const it = byId[w.item];
      const lane = (it && it.lane) || w.lane;
      if (lane) forYou[lane] = (forYou[lane] || 0) + 1;
    });
    const asked = {};
    wAgents.forEach((w) => {
      const it = byId[w.item];
      const lane = w.lane || (it && it.lane);
      if (lane) asked[lane] = (asked[lane] || 0) + 1;
    });
    return function laneState(laneId){
      const carrying = items.filter((i) => i.lane === laneId).length;
      const yours = forYou[laneId] || 0;
      const working = asked[laneId] || 0;
      if (yours) return { cls: 'amber', word: yours + ' for you', carrying };
      if (working) return { cls: 'live', word: 'working · ' + working, carrying };
      if (carrying) return { cls: 'live', word: carrying + ' open', carrying };
      return { cls: '', word: 'idle', carrying };
    };
  }
