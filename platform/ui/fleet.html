  /* ---- ambient particle drift (skipped entirely under reduced motion) ---- */
  function makeParticlesCanvas(){
    const canvas = document.createElement('canvas');
    canvas.className = 'deck-space';
    canvas.setAttribute('aria-hidden', 'true');
    requestAnimationFrame(() => startParticles(canvas));
    return canvas;
  }
  function startParticles(canvas){
    const ctx = canvas.getContext('2d');
    if (!ctx || !canvas.isConnected) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0, h = 0;
    const fit = () => {
      const box = canvas.getBoundingClientRect();
      w = box.width; h = box.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    fit();
    const N = 70;
    const dots = Array.from({ length: N }, (_, i) => ({
      x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 1.4,
      vx: (Math.random() - 0.5) * 0.00016, vy: (Math.random() - 0.5) * 0.00016,
      p: Math.random() * Math.PI * 2, amber: i % 5 === 0,
    }));
    let raf = 0;
    const ro = new ResizeObserver(fit);
    ro.observe(canvas);
    const draw = (t) => {
      if (!canvas.isConnected) { cancelAnimationFrame(raf); ro.disconnect(); return; }
      ctx.clearRect(0, 0, w, h);
      dots.forEach((d) => {
        d.x = (d.x + d.vx + 1) % 1; d.y = (d.y + d.vy + 1) % 1;
        const tw = 0.35 + 0.3 * Math.sin(t / 1600 + d.p);
        ctx.beginPath();
        ctx.arc(d.x * w, d.y * h, d.s, 0, Math.PI * 2);
        ctx.fillStyle = d.amber ? 'rgba(240,164,31,' + (tw * 0.8) + ')' : 'rgba(155,166,191,' + (tw * 0.5) + ')';
        ctx.fill();
      });
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
  }

  /* ================= COMMAND (deck) ================= */
  function renderDeckView(main){
    const ctx = state.context;
    if (!ctx) { main.appendChild(el('div', { class: 'empty-state' }, ['loading'])); return; }
    const items = state.board.items || [];
    // Proposals awaiting a verdict. A returned platform decision is also on
    // that list and is NOT awaiting a verdict, so it is counted separately and
    // never folded into this number: two places on one screen disagreeing about
    // the same thing is worse than either number alone.
    const wYou = (state.board.waiting_on_you || []).filter((w) => w.entry);
    const decided = (state.board.waiting_on_you || []).filter((w) => !w.entry);
    const wAgents = state.board.waiting_on_agents || [];
    const t = today();
    const dueNow = items.filter((i) => i.due && i.due <= t).length;
    const laneState = laneStateMap();
    const sectors = buildSectors();
    const { sectors: sectorPos, nodes } = layoutDeck(sectors);
    const nodeAt = {};
    nodes.forEach((n) => { nodeAt[n.lane] = n; });
    const motionOff = reduceMotion();

    const field = dueNow > 0
      ? { tone: 'hot', text: 'pressure · ' + dueNow + ' due now' }
      : wYou.length > 0
        ? { tone: 'amber', text: wYou.length + ' awaiting your call' }
        : { tone: 'ok', text: 'all lanes steady' };

    /* ---- left: Situation + Live signals ---- */
    const situationPanel = el('div', { class: 'deck-panel' }, [
      el('h3', {}, ['Situation']),
      el('div', { class: 'deck-nums' }, [
        el('div', { class: dueNow ? 'hot' : '' }, [el('b', {}, [String(dueNow)]), el('span', {}, ['due now'])]),
        el('div', { class: wYou.length ? 'amber' : '' }, [el('b', {}, [String(wYou.length)]), el('span', {}, ['awaiting you'])]),
        el('div', {}, [el('b', {}, [String(wAgents.length)]), el('span', {}, ['with agents'])]),
        el('div', {}, [el('b', {}, [String(items.length)]), el('span', {}, ['open'])]),
        decided.length
          ? el('div', { class: 'amber' }, [el('b', {}, [String(decided.length)]), el('span', {}, ['decided, to read'])])
          : null,
      ]),
    ]);

    const signalsRaw = [];
    items.forEach((it) => { (it.thread || []).forEach((e) => { if (e.kind !== 'change') signalsRaw.push({ it, e }); }); });
    signalsRaw.sort((a, b) => (a.e.at < b.e.at ? 1 : -1));
    const signals = signalsRaw.slice(0, 8);

    const signalsPanel = el('div', { class: 'deck-panel deck-signals' }, [el('h3', {}, ['Live signals'])]);
    if (!signals.length) signalsPanel.appendChild(el('p', { class: 'hint' }, ['No thread activity yet.']));
    signals.forEach(({ it, e }) => {
      const hue = hashHue(it.lane);
      const btn = el('button', { class: 'deck-signal', style: '--hue:' + hue, title: it.title }, [
        el('span', { class: 'deck-signal-top' }, [
          el('i', { class: 'deck-dot' }),
          el('b', {}, [actorLabel(e.author) + ' ' + (VERB[e.kind] || e.kind)]),
          el('em', { class: 'ts' }, [fmtShort(e.at)]),
        ]),
        el('span', { class: 'deck-signal-body' }, [e.body || it.title]),
      ]);
      btn.addEventListener('click', () => openItemFromDeck(it.id));
      signalsPanel.appendChild(btn);
    });

    const leftAside = el('aside', { class: 'deck-side' }, [situationPanel, signalsPanel]);

    /* ---- centre: the radial field ---- */
    const stage = el('div', { class: 'deck-stage', style: motionOff ? '' : ('--period:' + PERIOD + 's') });
    if (!motionOff) stage.appendChild(makeParticlesCanvas());
    stage.appendChild(el('p', { class: 'deck-field ' + field.tone }, [el('i', {}), field.text]));

    sectorPos.forEach(({ c, a0, span }) => {
      stage.appendChild(el('div', {
        class: 'deck-sector', 'aria-hidden': true,
        style: '--hue:' + c.hue + ';--a0:' + roundV(a0 + 90) + ';--span:' + roundV(span) + ';--flare:' + delayFor(a0) + 's',
      }));
    });

    stage.appendChild(el('div', { class: 'deck-ring r1' }));
    stage.appendChild(el('div', { class: 'deck-ring r2' }));
    stage.appendChild(el('div', { class: 'deck-ring r3' }));
    stage.appendChild(el('div', { class: 'deck-ring spin' }));
    stage.appendChild(el('div', { class: 'deck-sweep', 'aria-hidden': true }));

    // Sector edges. There is no reporting-line data in this repo's lane
    // registry (no equivalent of Deck.tsx's REPORTS_TO), so only the wedge
    // boundaries are drawn - see the note in buildSectors() above.
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'deck-lines');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    sectorPos.forEach(({ a0, span }) => {
      [a0, a0 + span].forEach((a) => {
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', String(pxPos(a, 0.42)));
        line.setAttribute('y1', String(pyPos(a, 0.42)));
        line.setAttribute('x2', String(pxPos(a, 0.9)));
        line.setAttribute('y2', String(pyPos(a, 0.9)));
        line.setAttribute('class', 'deck-edge');
        svg.appendChild(line);
      });
    });
    stage.appendChild(svg);

    sectorPos.forEach(({ c, mid }) => {
      const rl = 1 - 0.18 * Math.abs(Math.cos(rad(mid)));
      stage.appendChild(el('span', {
        class: 'deck-sector-name', title: c.name + ' - ' + c.blurb,
        style: 'left:' + pxPos(mid, rl) + '%;top:' + pyPos(mid, rl) + '%;--hue:' + c.hue + ';--flare:' + delayFor(mid) + 's',
      }, [c.tag]));
    });

    nodes.forEach(({ lane, a, r, cluster }) => {
      const meta = ((state.context && state.context.lanes) || {})[lane] || { name: lane, role: '' };
      const s = laneState(lane);
      const hue = hashHue(lane);
      const btn = el('button', {
        class: 'deck-node' + (s.carrying ? ' busy' : ''),
        style: 'left:' + pxPos(a, r) + '%;top:' + pyPos(a, r) + '%;--hue:' + hue + ';--flare:' + delayFor(a) + 's',
        title: meta.name + ' - ' + (meta.role || '') + ' · ' + cluster.name + '. Filter the board to this lane.',
      }, [
        el('i', { class: 'deck-node-dot' }),
        el('span', { class: 'deck-node-name' }, [meta.name]),
        el('span', { class: 'deck-node-sub' }, [s.word]),
      ]);
      btn.addEventListener('click', () => openLaneInBoard(lane));
      stage.appendChild(btn);
    });

    const core = el('button', {
      class: 'deck-core', title: 'Filter the board to your own lane',
    }, [
      el('span', { class: 'deck-core-glow', 'aria-hidden': true }),
      el('span', { class: 'deck-core-ring', 'aria-hidden': true }),
      el('span', { class: 'deck-core-name' }, [ownerName()]),
      el('span', { class: 'deck-core-sub' }, ['Mission Control']),
      el('span', { class: 'deck-core-load' }, [items.length + ' in play']),
    ]);
    core.addEventListener('click', () => openLaneInBoard('owner'));
    stage.appendChild(core);

    /* ---- right: Agent presence ---- */
    const presencePanel = el('div', { class: 'deck-panel deck-presence' }, [el('h3', {}, ['Agent presence'])]);
    if (!sectors.length) presencePanel.appendChild(el('p', { class: 'hint' }, ['No agent lanes registered for this fleet.']));
    sectors.forEach((c) => {
      const group = el('div', { class: 'deck-group', style: '--hue:' + c.hue }, [
        el('h4', { class: 'deck-group-name', title: c.blurb }, [el('i', {}), c.name]),
      ]);
      c.members.forEach((lane) => {
        const meta = ((state.context && state.context.lanes) || {})[lane] || { name: lane, role: '' };
        const s = laneState(lane);
        const hue = hashHue(lane);
        const n = nodeAt[lane];
        const btn = el('button', { class: 'deck-agent', style: '--hue:' + hue + ';--flare:' + (n ? delayFor(n.a) : 0) + 's' }, [
          el('i', { class: 'deck-dot' }),
          el('span', { class: 'deck-agent-main' }, [el('b', {}, [meta.name]), el('span', {}, [meta.role || ''])]),
          el('em', { class: 'deck-agent-state ' + s.cls }, [s.word]),
        ]);
        btn.addEventListener('click', () => openLaneInBoard(lane));
        group.appendChild(btn);
      });
      presencePanel.appendChild(group);
    });
    const rightAside = el('aside', { class: 'deck-side' }, [presencePanel]);

    main.appendChild(el('section', { class: 'deck' }, [leftAside, stage, rightAside]));
  }

  /* ================= agents: names, state, the pop-up ================= */
  function titleCase(s){ return String(s || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()); }
  function agentName(id){
    const m = (state.context && state.context.lanes && state.context.lanes[id]) || null;
    return (m && m.name && m.name !== id) ? m.name : titleCase(id);
  }
  function agentRole(id){
    const m = (state.context && state.context.lanes && state.context.lanes[id]) || null;
    return (m && m.role) || '';
  }
  function agentList(){ return (state.context && state.context.agents) || []; }
  function agentTasks(id){ return (state.board.items || []).filter((i) => i.lane === id); }

  // The state a person reads at a glance, derived from the agent's own tasks.
  function agentState(id){
    const ts = agentTasks(id);
    const wYou = state.board.waiting_on_you || [];
    const pendingHere = wYou.some((w) => w.entry && ts.some((t) => t.id === w.item));
    if (ts.some((t) => t.status === 'blocked')) return { label: 'Blocked', cls: 'st-blocked' };
    if (ts.some((t) => t.status === 'now')) return { label: 'Working', cls: 'st-now' };
    if (pendingHere || ts.some((t) => t.status === 'waiting')) return { label: 'Waiting', cls: 'st-wait' };
    if (!ts.length) return { label: 'Idle', cls: 'st-idle' };
    return { label: 'On track', cls: 'st-idle' };
  }

  // The agent state as a POP-UP, not an inline list. Opened from a swimlane
  // header or an org-chart node.
  function openAgentModal(id){
    const overlay = modalOverlay();
    const st = agentState(id);
    const ts = agentTasks(id);
    const meta = (state.context.agents || []).find((a) => a.id === id) || {};
    const reportsTo = meta.orchestrator ? ownerName()
      : (meta.reports_to ? agentName(meta.reports_to) : '—');
    const byStatus = {};
    ts.forEach((t) => { (byStatus[t.status] = byStatus[t.status] || []).push(t); });

    const taskEls = [];
    statusOrder().forEach((key) => {
      const rows = byStatus[key] || [];
      if (!rows.length) return;
      taskEls.push(el('div', { class: 'am-status' }, [statusLabel(key) + ' · ' + rows.length]));
      rows.forEach((t) => {
        const row = el('button', { class: 'am-task' }, [
          el('span', { class: 'am-task-dot ' + statusDotClass(key) }),
          el('span', { class: 'am-task-title' }, [t.title]),
          el('span', { class: 'am-task-kind' }, [t.kind]),
        ]);
        row.addEventListener('click', () => {
          overlay.remove();
          state.view = 'board'; state.board.selectedId = t.id; state.board.detail = null; renderShell();
        });
        taskEls.push(row);
      });
    });

    const card = el('div', { class: 'am-card' }, [
      el('div', { class: 'am-head' }, [
        el('div', { class: 'am-avatar', style: 'background:hsl(' + hashHue(id) + ' 55% 42%)' }, [agentName(id).slice(0, 1)]),
        el('div', { class: 'am-id' }, [
          el('div', { class: 'am-name' }, [agentName(id), meta.orchestrator ? el('span', { class: 'am-orch' }, ['orchestrator']) : null]),
          el('div', { class: 'am-role' }, [agentRole(id) || '—']),
        ]),
        el('span', { class: 'state-pill ' + st.cls }, [st.label]),
      ]),
      el('div', { class: 'am-meta' }, [
        el('div', { class: 'am-kv' }, [el('span', {}, ['Reports to']), el('b', {}, [reportsTo])]),
        el('div', { class: 'am-kv' }, [el('span', {}, ['Open tasks']), el('b', {}, [String(ts.length)])]),
      ]),
      el('div', { class: 'am-tasks' }, taskEls.length ? taskEls : [el('div', { class: 'empty-state' }, ['no open tasks'])]),
    ]);
    const close = el('button', { class: 'am-close', title: 'Close' }, ['×']);
    close.addEventListener('click', () => overlay.remove());
    card.insertBefore(close, card.firstChild);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  function statusLabel(key){
    const s = state.context && state.context.statuses;
    return (s && s[key] && s[key].name) || key;
  }
  function statusDotClass(key){
    return ({ now: 'd-now', blocked: 'd-blocked', waiting: 'd-wait', parked: 'd-parked', done: 'd-done', shipped: 'd-done' })[key] || 'd-idle';
  }

  /* ================= ORG CHART ================= */
  function renderOrgView(main){
    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Org chart']),
        el('div', { class: 'view-sub' }, ['The fleet owner, the orchestrator, and every AI employee reporting through it. Click anyone to see their state.']),
      ]),
    ]));

    const agents = agentList();
    if (!agents.length) {
      main.appendChild(el('div', { class: 'empty-state' }, ['no agents registered for this fleet']));
      return;
    }
    const orch = agents.find((a) => a.orchestrator) || agents[0];
    const children = agents.filter((a) => a.id !== orch.id);

    const node = (opts) => {
      const n = el('button', { class: 'orgc-node' + (opts.kind ? ' ' + opts.kind : '') }, [
        el('div', { class: 'orgc-avatar', style: 'background:' + (opts.avatarBg || 'var(--panel-3)') }, [opts.initial]),
        el('div', { class: 'orgc-body' }, [
          el('div', { class: 'orgc-name' }, [opts.name]),
          el('div', { class: 'orgc-sub' }, [opts.sub]),
        ]),
        opts.state ? el('span', { class: 'state-pill ' + opts.state.cls }, [opts.state.label]) : null,
      ]);
      if (opts.onClick) n.addEventListener('click', opts.onClick); else n.disabled = true;
      return n;
    };

    const chart = el('div', { class: 'orgchart' });
    // Owner (the human)
    chart.appendChild(el('div', { class: 'orgc-level' }, [
      node({ kind: 'orgc-owner', initial: ownerName().slice(0, 1), name: ownerName(),
        sub: (state.context.employee && state.context.employee.title) || 'fleet owner' }),
    ]));
    chart.appendChild(el('div', { class: 'orgc-connector' }));
    // Orchestrator
    chart.appendChild(el('div', { class: 'orgc-level' }, [
      node({ kind: 'orgc-orch', initial: agentName(orch.id).slice(0, 1), avatarBg: 'hsl(' + hashHue(orch.id) + ' 55% 42%)',
        name: agentName(orch.id), sub: 'orchestrator · ' + (agentRole(orch.id) || 'chief of staff'),
        state: agentState(orch.id), onClick: () => openAgentModal(orch.id) }),
    ]));
    // Children reporting to the orchestrator
    if (children.length) {
      chart.appendChild(el('div', { class: 'orgc-connector' }));
      const row = el('div', { class: 'orgc-children' });
      children.forEach((a) => {
        row.appendChild(el('div', { class: 'orgc-child' }, [
          node({ initial: agentName(a.id).slice(0, 1), avatarBg: 'hsl(' + hashHue(a.id) + ' 55% 42%)',
            name: agentName(a.id), sub: agentRole(a.id) || 'agent', state: agentState(a.id),
            onClick: () => openAgentModal(a.id) }),
        ]));
      });
      chart.appendChild(row);
    }
    main.appendChild(chart);
  }

  /* ================= BOARD ================= */
  //
  // An item's status (where the work is) and its lane (who owns it) are two
  // separate axes now; a pending proposal lives on the thread, not on the item.
  // This view is built around that: columns group by status, two queues surface
  // what needs a person versus what needs an agent, and the detail panel reads
  // the conversation the server already split from its own bookkeeping.

  function laneName(laneId){
    const lanes = state.context && state.context.lanes;
    return (lanes && lanes[laneId] && lanes[laneId].name) || laneId;
  }
  function laneDisplayName(laneId){
    return laneId === 'owner' ? ownerName() : laneName(laneId);
  }

  // Who said this, in words. The owner's own id resolves to their name; 'system'
  // is the board itself; anything else is a lane.
  function actorLabel(author){
    if (author === 'system') return 'system';
    const who = state.whoami && state.whoami.employee;
    if (who && author === who.id) return who.name || author;
    return laneName(author);
  }
  function roleOf(author){
    if (author === 'system') return 'system';
    const who = state.whoami && state.whoami.employee;
    if (who && author === who.id) return 'owner';
    return 'agent';
  }
  function roleInitial(entry, role){
    if (role === 'owner') {
      const who = state.whoami && state.whoami.employee;
      return ((who && who.name) || 'O').slice(0, 1).toUpperCase();
    }
    if (role === 'system') return 'S';
    return (entry.author || 'A').slice(0, 1).toUpperCase();
  }

  function statusOrder(){
    const statuses = state.context && state.context.statuses;
    return statuses ? Object.keys(statuses) : ['now', 'blocked', 'waiting', 'parked', 'done', 'shipped'];
  }

  function renderBoardView(main){
    const ctx = state.context;
    const items = state.board.items || [];
    const wYou = state.board.waiting_on_you || [];
    const wAgents = state.board.waiting_on_agents || [];

    const newItemBtn = el('button', { class: 'btn-ghost' }, ['+ New item']);
    newItemBtn.addEventListener('click', () => openNewItemDialog());
    const instructBtn = el('button', { class: 'btn' }, ['+ Instruct']);
    instructBtn.addEventListener('click', () => openInstructDialog());

    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Board']),
        el('div', { class: 'view-sub' }, ['Where the work is, and who has the ball.']),
      ]),
      el('div', { class: 'row' }, [newItemBtn, instructBtn]),
    ]));

    // Two queues, and neither is the other: what needs a verdict (also on
    // Approvals), and what an agent has not answered yet.
    const queueRow = el('div', { class: 'queue-row' });
    const youCard = el('button', { class: 'queue-card' + (state.board.queueFilter === 'you' ? ' active' : '') }, [
      el('div', { class: 'queue-count' }, [String(wYou.length)]),
      el('div', { class: 'queue-label' }, ['Waiting on you']),
    ]);
    youCard.addEventListener('click', () => { state.board.queueFilter = state.board.queueFilter === 'you' ? null : 'you'; renderShell(); });
    const agentsCard = el('button', { class: 'queue-card' + (state.board.queueFilter === 'agents' ? ' active' : '') }, [
      el('div', { class: 'queue-count' }, [String(wAgents.length)]),
      el('div', { class: 'queue-label' }, ['Waiting on an agent']),
    ]);
    agentsCard.addEventListener('click', () => { state.board.queueFilter = state.board.queueFilter === 'agents' ? null : 'agents'; renderShell(); });
    queueRow.appendChild(youCard);
    queueRow.appendChild(agentsCard);
    if (state.board.queueFilter) {
      const clearBtn = el('button', { class: 'filter-btn active' }, ['clear queue filter ×']);
      clearBtn.addEventListener('click', () => { state.board.queueFilter = null; renderShell(); });
      queueRow.appendChild(clearBtn);
    }
    if (state.board.laneFilter) {
      const laneClear = el('button', { class: 'filter-btn active' }, ['lane: ' + laneDisplayName(state.board.laneFilter) + ' ×']);
      laneClear.addEventListener('click', () => { state.board.laneFilter = null; renderShell(); });
      queueRow.appendChild(laneClear);
    }
    main.appendChild(queueRow);

    let displayItems = items;
    if (state.board.queueFilter === 'you') {
      const ids = new Set(wYou.map((w) => w.item));
      displayItems = items.filter((i) => ids.has(i.id));
    } else if (state.board.queueFilter === 'agents') {
      const ids = new Set(wAgents.map((w) => w.item));
      displayItems = items.filter((i) => ids.has(i.id));
    }
    if (state.board.laneFilter) {
      displayItems = displayItems.filter((i) => i.lane === state.board.laneFilter);
    }

    // Jira-style swimlanes: one row per AI employee, one column per status. Every
    // registered agent gets a row even at zero tasks, so the whole fleet is visible
    // at a glance; a lane header is a button that pops up that agent's state.
    const activeStatuses = statusOrder().filter((k) => displayItems.some((i) => i.status === k));
    if (!activeStatuses.length) {
      main.appendChild(el('div', { class: 'empty-state' }, ['no items match this view']));
    } else {
      const laneIds = agentList().map((a) => a.id);
      displayItems.forEach((i) => { if (!laneIds.includes(i.lane)) laneIds.push(i.lane); });
      const template = '190px repeat(' + activeStatuses.length + ', minmax(168px, 1fr))';

      const legend = el('div', { class: 'swim-legend' },
        activeStatuses.map((k) => el('span', { class: 'swim-legend-item' }, [
          el('span', { class: 'am-task-dot ' + statusDotClass(k) }), statusLabel(k),
        ])));
      main.appendChild(legend);

      const scroller = el('div', { class: 'swimboard-scroll' });
      const board = el('div', { class: 'swimboard' });

      const head = el('div', { class: 'swim-row swim-head', style: 'grid-template-columns:' + template });
      head.appendChild(el('div', { class: 'swim-corner' }, ['Agent']));
      activeStatuses.forEach((k) => head.appendChild(el('div', { class: 'swim-colhead' }, [
        el('span', {}, [statusLabel(k)]),
        el('span', { class: 'badge-count' }, [String(displayItems.filter((i) => i.status === k).length)]),
      ])));
      board.appendChild(head);

      laneIds.forEach((lane) => {
        const laneItems = displayItems.filter((i) => i.lane === lane);
        const isAgent = agentList().some((a) => a.id === lane);
        const row = el('div', { class: 'swim-row', style: 'grid-template-columns:' + template });

        const st = agentState(lane);
        const laneHead = el(isAgent ? 'button' : 'div', { class: 'swim-lane' + (isAgent ? '' : ' swim-lane-static') }, [
          el('div', { class: 'swim-avatar', style: 'background:hsl(' + hashHue(lane) + ' 55% 42%)' }, [laneDisplayName(lane).slice(0, 1)]),
          el('div', { class: 'swim-lane-body' }, [
            el('div', { class: 'swim-lane-name' }, [laneDisplayName(lane)]),
            el('div', { class: 'swim-lane-role' }, [isAgent ? (agentRole(lane) || 'agent') : 'you']),
            isAgent ? el('span', { class: 'state-pill ' + st.cls }, [st.label]) : null,
          ]),
        ]);
        if (isAgent) laneHead.addEventListener('click', () => openAgentModal(lane));
        row.appendChild(laneHead);

        activeStatuses.forEach((k) => {
          const cell = el('div', { class: 'swim-cell' });
          laneItems.filter((i) => i.status === k).forEach((it) => cell.appendChild(renderItemCard(it, wYou)));
          row.appendChild(cell);
        });
        board.appendChild(row);
      });
      scroller.appendChild(board);
      main.appendChild(scroller);
    }

    // Default the detail to whatever needs the owner, not to whatever sorted
    // first, but only among items actually on the board right now.
    if (!state.board.selectedId || !displayItems.some((i) => i.id === state.board.selectedId)) {
      const firstWaiting = wYou.find((w) => displayItems.some((i) => i.id === w.item));
      state.board.selectedId = (firstWaiting && firstWaiting.item) || (displayItems[0] && displayItems[0].id) || null;
    }

    const detailWrap = el('div', { style: 'margin-top:18px' });
    if (state.board.selectedId) {
      if (!state.board.detail || state.board.detail.id !== state.board.selectedId) {
        if (state.board.detailLoading !== state.board.selectedId) loadItemDetail(state.board.selectedId);
        detailWrap.appendChild(el('div', { class: 'empty-state' }, ['loading item...']));
      } else {
        renderItemDetail(detailWrap, state.board.detail);
      }
    } else {
      detailWrap.appendChild(el('div', { class: 'empty-state' }, ['nothing on the board yet: use + Instruct or + New item']));
    }
    main.appendChild(detailWrap);
  }

  function renderItemCard(item, wYou){
    const pendingHere = (wYou || []).some((w) => w.item === item.id && w.entry);
    const metaBits = [];
    if (item.next) metaBits.push('next: ' + item.next);
    if (item.waitingOn) metaBits.push('waiting on: ' + item.waitingOn);
    const children = [
      el('div', { class: 'item-title' }, [pendingHere ? el('span', { class: 'waiting-badge' }) : null, item.title]),
      el('div', { class: 'item-meta' }, [item.kind]),
    ];
    if (metaBits.length) children.push(el('div', { style: 'font-size:11px; color:var(--ink-faint); margin-top:4px' }, [metaBits.join(' · ')]));
    if (item.tag) children.push(el('div', { style: 'margin-top:5px' }, [el('span', { class: 'chip chip-neutral' }, [item.tag])]));
    const card = el('button', { class: 'item-card' + (state.board.selectedId === item.id ? ' selected' : '') }, children);
    card.addEventListener('click', () => {
      state.board.selectedId = item.id;
      state.board.detail = null;
      state.board.historyOpen = false;
      renderShell();
    });
    return card;
  }

  /* ---- approvals: the pending-proposal list ---- */
  function renderApprovalsView(main){
    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Approvals']),
        el('div', { class: 'view-sub' }, ['Proposals waiting on your verdict, one row per item.']),
      ]),
    ]));
    const items = state.board.items || [];
    const byId = {};
    items.forEach((i) => { byId[i.id] = i; });
    // Only a real proposal has an entry id here - "waiting on you" also covers
    // things like acknowledging a platform team decision, which is not a
    // verdict this view should ask for.
    const wYou = (state.board.waiting_on_you || []).filter((w) => w.entry);
    const matches = wYou.map((w) => ({ w, item: byId[w.item] })).filter((x) => x.item);

    if (!matches.length) {
      main.appendChild(el('div', { class: 'empty-state' }, ['nothing awaiting your verdict']));
      return;
    }
    if (!state.board.selectedId || !matches.some((x) => x.item.id === state.board.selectedId)) {
      state.board.selectedId = matches[0].item.id;
    }
    const layout = el('div', { class: 'board-layout' });
    const list = el('div', { class: 'board-list' });
    matches.forEach(({ w, item }) => {
      const children = [
        el('div', { class: 'item-title' }, [item.title]),
        el('div', { class: 'item-meta' }, [laneDisplayName(item.lane) + ' · ' + item.kind]),
      ];
      if (w.why) children.push(el('div', { style: 'font-size:11px; color:var(--ink-faint); margin-top:4px' }, [w.why]));
      const card = el('button', { class: 'item-card' + (state.board.selectedId === item.id ? ' selected' : '') }, children);
      card.addEventListener('click', () => {
        state.board.selectedId = item.id;
        state.board.detail = null;
        state.board.historyOpen = false;
        renderShell();
      });
      list.appendChild(card);
    });
    layout.appendChild(list);

    const detailWrap = el('div', { class: 'board-detail' });
    if (!state.board.detail || state.board.detail.id !== state.board.selectedId) {
      if (state.board.detailLoading !== state.board.selectedId) loadItemDetail(state.board.selectedId);
      detailWrap.appendChild(el('div', { class: 'empty-state' }, ['loading item...']));
    } else {
      renderItemDetail(detailWrap, state.board.detail);
    }
    layout.appendChild(detailWrap);
    main.appendChild(layout);
  }

  /* ---- archived ---- */
  function renderArchivedView(main){
    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Archived']),
        el('div', { class: 'view-sub' }, ['Left the board, but nothing is lost. Restore brings an item back as it was.']),
      ]),
    ]));

    if (!state.board.archivedLoaded && !state.board.archivedLoading) loadArchived();
    if (state.board.archivedLoading && !state.board.archivedLoaded) {
      main.appendChild(el('div', { class: 'empty-state' }, ['loading archive...']));
      return;
    }

    const items = state.board.archivedItems || [];
    if (!items.length) {
      main.appendChild(el('div', { class: 'empty-state' }, ['nothing archived']));
      return;
    }
    items.forEach((item) => {
      const restoreBtn = el('button', { class: 'btn-ghost btn-sm' }, ['Restore']);
      restoreBtn.addEventListener('click', async () => {
        restoreBtn.disabled = true;
        const res = await api('/api/fleet/board/' + item.id + '/restore', { method: 'POST' });
        restoreBtn.disabled = false;
        if (res.ok) { state.board.archivedLoaded = false; await loadArchived(); await loadBoard(); renderShell(); }
      });
      main.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row-between' }, [
          el('h3', {}, [item.title]),
          itemStatusChip(item.status),
        ]),
        el('div', { style: 'font-size:12px; color:var(--ink-faint); margin-top:2px' }, [
          laneDisplayName(item.lane) + ' · ' + item.kind + ' · archived ' + fmtTime(item.archivedAt),
        ]),
        item.archiveReason ? el('div', { style: 'font-size:13px; margin-top:6px' }, ['reason: ' + item.archiveReason]) : null,
        el('div', { style: 'margin-top:10px' }, [restoreBtn]),
      ]));
    });
  }

  /* ---- item detail ---- */
  function renderItemDetail(container, detail){
    clear(container);
    const item = detail.item;
    const ctx = state.context;
    const myAgents = (ctx && ctx.agents) || [];

    const headerChips = [
      el('span', { class: 'chip chip-neutral' }, [laneDisplayName(item.lane)]),
      el('span', { class: 'chip chip-neutral' }, [item.kind]),
    ];
    if (item.tag) headerChips.push(el('span', { class: 'chip chip-neutral' }, [item.tag]));
    if (item.archived) headerChips.push(el('span', { class: 'chip chip-red' }, ['archived']));

    container.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'row-between' }, [
        el('h3', {}, [item.title]),
        itemStatusChip(item.status),
      ]),
      el('div', { class: 'row', style: 'margin-top:6px' }, headerChips),
      el('div', { style: 'color:var(--ink-faint); font-size:12px; margin-top:8px' }, [
        item.id + ' · created ' + fmtTime(item.created_at) + ' · touched ' + item.touched,
      ]),
      el('dl', { class: 'kv', style: 'margin-top:10px' }, [
        el('dt', {}, ['next']), el('dd', {}, [item.next || '—']),
        el('dt', {}, ['waiting on']), el('dd', {}, [item.waitingOn || '—']),
        el('dt', {}, ['due']), el('dd', {}, [item.due || '—']),
      ]),
      item.status === 'parked' && item.parkReason ? el('div', { style: 'font-size:12px; color:var(--ink-faint); margin-top:6px' }, ['parked: ' + item.parkReason]) : null,
    ]));

    // The unmissable panel: a pending proposal needs a verdict before anything
    // else on this item.
    if (detail.pending) container.appendChild(renderPendingPanel(item, detail.pending));

    const threadCard = el('div', { class: 'card' });
    threadCard.appendChild(el('div', { class: 'section-title' }, ['Conversation']));
    const threadBox = el('div', { class: 'thread' });
    const conv = detail.conversation || [];
    if (!conv.length) threadBox.appendChild(el('div', { class: 'empty-state' }, ['nothing said yet']));
    conv.forEach((entry) => threadBox.appendChild(renderThreadEntry(entry)));
    threadCard.appendChild(threadBox);
    container.appendChild(threadCard);

    container.appendChild(renderHistoryBlock(detail.changes || []));
    container.appendChild(renderItemActions(item));
    container.appendChild(renderInstructMoreForm(item));
    container.appendChild(renderProposeForm(item, myAgents));
    container.appendChild(renderReportForm(item, myAgents));
  }

  function renderThreadEntry(entry){
    const role = roleOf(entry.author);
    const label = actorLabel(entry.author);
    const body = [
      el('div', { class: 'thread-head' }, [
        el('span', { class: 'thread-who' }, [label]),
        el('span', { class: 'thread-role' }, [role]),
        el('span', { class: 'thread-time' }, [fmtTime(entry.at)]),
      ]),
    ];

    if (entry.kind === 'proposal') {
      body.push(el('div', { class: 'thread-kind' }, ['proposal']));
      body.push(renderProposalStructured(entry.proposal || {}));
      if (entry.candidate) body.push(renderCandidateBlock(entry.candidate));
      body.push(el('div', { style: 'margin-top:6px' }, [
        entry.verdict ? verdictChip(entry.verdict) : el('span', { class: 'chip chip-amber' }, ['awaiting your verdict']),
      ]));
    } else if (entry.kind === 'decision') {
      body.push(el('div', { class: 'thread-text' }, [entry.body || '']));
      body.push(el('div', { style: 'margin-top:4px' }, [verdictChip(entry.verdict)]));
    } else if (entry.kind === 'report') {
      body.push(el('div', { class: 'thread-text' }, [entry.body || '']));
      if (entry.published) {
        body.push(el('div', { class: 'row', style: 'margin-top:6px' }, [
          el('span', { class: 'chip chip-green' }, ['published']),
          el('code', {}, [entry.published.id]),
          el('span', { class: 'chip chip-neutral' }, [entry.published.scope]),
        ]));
      }
    } else {
      body.push(el('div', { class: 'thread-text' }, [entry.body || '']));
    }

    const attrs = { class: 'thread-entry ' + role };
    if (role === 'agent') attrs.style = '--hue:' + hashHue(entry.author);
    return el('div', attrs, [
      el('div', { class: 'thread-avatar' }, [roleInitial(entry, role)]),
      el('div', { class: 'thread-body' }, body),
    ]);
  }

  // Understanding / Actions / Needs / Will not / source: the four questions a
  // proposal has to answer before it can be approved, plus where it came from.
  function renderProposalStructured(p){
    const box = el('div', { style: 'margin:6px 0' });
    box.appendChild(el('div', { style: 'font-size:13px' }, [el('b', {}, ['Understanding: ']), p.understanding || '—']));
    box.appendChild(el('div', { class: 'section-title', style: 'margin-top:8px' }, ['Actions']));
    box.appendChild(el('ul', { style: 'margin:2px 0 0 18px; padding:0' }, (p.actions || []).map((a) => el('li', { style: 'font-size:13px' }, [a]))));
    if ((p.needs || []).length) {
      box.appendChild(el('div', { class: 'section-title', style: 'margin-top:8px' }, ['Needs']));
      box.appendChild(el('ul', { style: 'margin:2px 0 0 18px; padding:0' }, p.needs.map((n) => el('li', { style: 'font-size:13px' }, [n]))));
    }
    if (p.caution) {
      box.appendChild(el('div', { class: 'section-title', style: 'margin-top:8px' }, ['Will not']));
      box.appendChild(el('div', { style: 'font-size:13px' }, [p.caution]));
    }
    box.appendChild(el('div', { style: 'margin-top:8px' }, [sourceChip(p.source)]));
    return box;
  }

  function renderCandidateBlock(candidate){
    const box = el('div', { style: 'margin:8px 0' });
    box.appendChild(el('dl', { class: 'kv' }, [
      el('dt', {}, ['kind']), el('dd', {}, [candidate.kind]),
      el('dt', {}, ['subject']), el('dd', {}, [(candidate.body && candidate.body.subject) || '—']),
      el('dt', {}, ['value']), el('dd', {}, [el('pre', {}, [typeof (candidate.body && candidate.body.value) === 'object' ? JSON.stringify(candidate.body.value, null, 2) : String((candidate.body && candidate.body.value) ?? '—')])]),
    ]));
    if ((candidate.derived_from || []).length) {
      box.appendChild(el('div', { class: 'section-title', style: 'margin-top:8px' }, ['derived from']));
      const chain = el('div', { class: 'row' });
      candidate.derived_from.forEach((id) => chain.appendChild(el('span', { class: 'chip chip-neutral' }, [id])));
      box.appendChild(chain);
    }
    if ((candidate.sources || []).length) {
      box.appendChild(el('div', { class: 'section-title', style: 'margin-top:8px' }, ['sources']));
      const chain = el('div', { class: 'row' });
      candidate.sources.forEach((s) => chain.appendChild(el('span', { class: 'chip ' + (s.harness ? 'chip-amber' : 'chip-neutral') }, [s.system + (s.harness ? ' (harness)' : '') + (s.ref ? ' · ' + s.ref : '')])));
      box.appendChild(chain);
    }
    return box;
  }

  function renderScopeBeat(res){
    const beat = el('div', { class: 'scope-beat' }, [
      el('div', { style: 'font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em' }, ['the ledger will compute']),
      el('div', { class: 'scope-label' }, [res.scope_label]),
      el('div', { class: 'scope-basis' }, [res.scope_basis]),
    ]);
    if (res.overruled) {
      beat.appendChild(el('div', { class: 'scope-overrule' }, [
        el('b', {}, ['Overruled. ']),
        'the producer asked for ',
        el('b', {}, [describeDeclared(res.declared_by_producer)]),
        ' but the ledger computes ',
        el('b', {}, [res.scope_label]),
        ' from the inputs. The wider audience will not see this.',
      ]));
    }
    return beat;
  }
  function describeDeclared(d){
    if (!d) return 'no declared scope';
    if (d.type === 'org') return 'org-wide';
    if (d.type === 'fleet') return 'fleet-private (' + d.fleet + ')';
    if (d.type === 'list') return (d.members || []).length + ' named';
    return JSON.stringify(d);
  }

  // The one panel that has to be unmissable: a proposal with no verdict. A plan
  // authorises and publishes nothing; a candidate output IS the publish action.
  function renderPendingPanel(item, pendingEntry){
    const hasCandidate = Boolean(pendingEntry.candidate);
    const box = el('div', { class: 'card', style: 'border-color:var(--accent-dim)' });
    box.appendChild(el('div', { class: 'section-title' }, ['Needs your verdict']));
    box.appendChild(el('div', { class: 'row', style: 'margin-bottom:6px' }, [
      el('span', { class: 'chip chip-neutral' }, ['from ' + actorLabel(pendingEntry.author)]),
    ]));
    box.appendChild(renderProposalStructured(pendingEntry.proposal || {}));

    if (hasCandidate) {
      box.appendChild(el('div', { class: 'section-title', style: 'margin-top:10px' }, ['Candidate output']));
      box.appendChild(renderCandidateBlock(pendingEntry.candidate));
      if (pendingEntry.scope_preview) box.appendChild(renderScopeBeat(pendingEntry.scope_preview));
    } else {
      box.appendChild(el('div', { style: 'background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:13px; color:var(--ink-dim)' }, [
        'This is a plan, not an output. Approving it authorises the plan and publishes nothing.',
      ]));
    }

    const noteInput = el('input', { type: 'text', placeholder: 'optional note with your verdict' });
    const approveBtn = el('button', { class: 'btn' }, [hasCandidate ? 'Approve (publishes)' : 'Approve plan (publishes nothing)']);
    const rejectBtn = el('button', { class: 'btn-ghost btn-danger' }, ['Reject']);
    approveBtn.addEventListener('click', async () => {
      approveBtn.disabled = true;
      const res = await api('/api/fleet/board/' + item.id + '/approve', { method: 'POST', body: { note: noteInput.value.trim() || null } });
      approveBtn.disabled = false;
      if (res.ok) await refreshBoardAndDetail(item.id);
    });
    rejectBtn.addEventListener('click', () => openRejectDialog(item));
    box.appendChild(el('div', { class: 'field', style: 'margin-top:10px' }, [noteInput]));
    box.appendChild(el('div', { class: 'row', style: 'margin-top:8px' }, [approveBtn, rejectBtn]));
    return box;
  }

  // History is bookkeeping, not conversation: quieter, collapsed by default,
  // and never mixed into the thread above.
  function renderHistoryBlock(changes){
    const box = el('div', { class: 'card', style: 'background:var(--bg)' });
    const count = changes.length;
    const toggle = el('button', { class: 'btn-ghost btn-sm' }, [
      'History (' + count + (count === 1 ? ' change' : ' changes') + ')' + (state.board.historyOpen ? ' – hide' : ' – show'),
    ]);
    box.appendChild(toggle);
    const list = el('div', { style: 'margin-top:8px' });
    if (state.board.historyOpen) {
      if (!count) list.appendChild(el('div', { class: 'empty-state' }, ['no changes yet']));
      changes.forEach((c) => list.appendChild(el('div', {
        style: 'font-size:12px; color:var(--ink-faint); padding:5px 0; border-bottom:1px solid var(--line-soft)',
      }, [fmtTime(c.at) + ' · ' + c.body])));
      box.appendChild(list);
    }
    toggle.addEventListener('click', () => { state.board.historyOpen = !state.board.historyOpen; renderShell(); });
    return box;
  }

  function statusOptions(selectedKey){
    const statuses = (state.context && state.context.statuses) || {};
    return Object.keys(statuses).map((k) => el('option', { value: k, selected: k === selectedKey }, [statuses[k].name]));
  }

  function renderItemActions(item){
    const box = el('div', { class: 'card' });
    box.appendChild(el('div', { class: 'section-title' }, ['Actions']));

    const statusSel = el('select', { 'aria-label': 'status' }, statusOptions(item.status));
    const statusBtn = el('button', { class: 'btn-ghost btn-sm' }, ['Update']);
    statusBtn.addEventListener('click', async () => {
      if (statusSel.value === item.status) return;
      statusBtn.disabled = true;
      const res = await api('/api/fleet/board/' + item.id + '/patch', { method: 'POST', body: { status: statusSel.value } });
      statusBtn.disabled = false;
      if (res.ok) await refreshBoardAndDetail(item.id);
    });

    const nextInput = el('input', { type: 'text', value: item.next || '', placeholder: 'next action' });
    const nextBtn = el('button', { class: 'btn-ghost btn-sm' }, ['Set next']);
    nextBtn.addEventListener('click', async () => {
      nextBtn.disabled = true;
      const res = await api('/api/fleet/board/' + item.id + '/patch', { method: 'POST', body: { next: nextInput.value.trim() || null } });
      nextBtn.disabled = false;
      if (res.ok) await refreshBoardAndDetail(item.id);
    });

    box.appendChild(el('div', { class: 'form-grid' }, [
      el('div', { class: 'field' }, [el('label', {}, ['status']), el('div', { class: 'row' }, [statusSel, statusBtn])]),
      el('div', { class: 'field' }, [el('label', {}, ['next action']), el('div', { class: 'row' }, [nextInput, nextBtn])]),
    ]));

    const parkBtn = el('button', { class: 'btn-ghost btn-sm' }, [item.status === 'parked' ? 'Unpark' : 'Park']);
    parkBtn.addEventListener('click', async () => {
      if (item.status === 'parked') {
        parkBtn.disabled = true;
        const res = await api('/api/fleet/board/' + item.id + '/unpark', { method: 'POST' });
        parkBtn.disabled = false;
        if (res.ok) await refreshBoardAndDetail(item.id);
      } else {
        openReasonDialog('Park this item', async (reason) => {
          const res = await api('/api/fleet/board/' + item.id + '/park', { method: 'POST', body: { reason } });
          if (res.ok) await refreshBoardAndDetail(item.id);
          return res.ok;
        });
      }
    });

    const archiveBtn = el('button', { class: 'btn-ghost btn-sm btn-danger' }, [item.archived ? 'Restore' : 'Archive']);
    archiveBtn.addEventListener('click', async () => {
      if (item.archived) {
        archiveBtn.disabled = true;
        const res = await api('/api/fleet/board/' + item.id + '/restore', { method: 'POST' });
        archiveBtn.disabled = false;
        if (res.ok) { state.board.selectedId = null; state.board.detail = null; await loadBoard(); renderShell(); }
      } else {
        openReasonDialog('Archive this item', async (reason) => {
          const res = await api('/api/fleet/board/' + item.id + '/archive', { method: 'POST', body: { reason } });
          if (res.ok) { state.board.selectedId = null; state.board.detail = null; await loadBoard(); renderShell(); }
          return res.ok;
        });
      }
    });
    box.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [parkBtn, archiveBtn]));

    const noteInput = el('textarea', { placeholder: 'log something, by hand' });
    const noteBtn = el('button', { class: 'btn-ghost btn-sm' }, ['Post note']);
    noteBtn.addEventListener('click', async () => {
      if (!noteInput.value.trim()) { showError('a note needs text'); return; }
      noteBtn.disabled = true;
      const res = await api('/api/fleet/board/' + item.id + '/note', { method: 'POST', body: { text: noteInput.value.trim() } });
      noteBtn.disabled = false;
      if (res.ok) await refreshBoardAndDetail(item.id);
    });
    box.appendChild(el('div', { class: 'field', style: 'margin-top:12px' }, [el('label', {}, ['note']), noteInput, el('div', { style: 'margin-top:6px' }, [noteBtn])]));

    return box;
  }

  // The API has no route to post a further instruction onto an item that
  // already exists: the board model supports it (FleetBoard.post accepts
  // kind 'instruction'), but api/fleet.mjs only wires that up for note and
  // report; instruct/add always open a brand new item. Rather than call a
  // route that does not exist, this composer says so plainly.
  function renderInstructMoreForm(item){
    const box = el('div', { class: 'card' });
    box.appendChild(el('div', { class: 'section-title' }, ['Add an instruction']));
    box.appendChild(el('div', { style: 'font-size:13px; color:var(--ink-dim)' }, [
      'The API does not expose a way to post a further instruction onto an existing item ' +
      '(only note and report can be added here; Instruct always opens a new item). ' +
      'Use the note above to log guidance on ' + item.id + ', or + Instruct to start a related item.',
    ]));
    return box;
  }

  function renderProposeForm(item, myAgents){
    const box = el('div', { class: 'card' });
    box.appendChild(el('div', { class: 'section-title' }, ['Propose']));

    const laneSel = el('select', { 'aria-label': 'lane' }, [
      el('option', { value: '' }, ['choose a lane']),
      ...myAgents.map((a) => el('option', { value: a.id, selected: item.lane === a.id }, [a.id + (a.purpose ? ' - ' + a.purpose : '')])),
    ]);
    const sourceSel = el('select', { 'aria-label': 'source' }, [
      el('option', { value: 'summary', selected: true }, ['summary (a guess written here)']),
      el('option', { value: 'agent' }, ['agent (the real agent answered)']),
      el('option', { value: 'offline' }, ['offline (nothing answered)']),
    ]);
    const understandingInput = el('input', { type: 'text', placeholder: 'understanding: restate the ask in one line' });
    const actionsInput = el('textarea', { placeholder: 'actions, one per line' });
    const needsInput = el('textarea', { placeholder: 'needs, one per line (leave empty if none)' });
    const cautionInput = el('input', { type: 'text', placeholder: 'will not / caution (optional)' });

    const candKind = el('input', { type: 'text', placeholder: 'candidate kind (optional; leave blank for a plan only)' });
    const candSubject = el('input', { type: 'text', placeholder: 'subject' });
    const candValue = el('textarea', { placeholder: 'value (plain text or JSON)' });
    const candDerived = el('input', { type: 'text', placeholder: 'derived_from: comma-separated output ids' });
    const candSys = el('input', { type: 'text', placeholder: 'source system (optional)' });
    const candRef = el('input', { type: 'text', placeholder: 'source ref' });
    const candHarness = el('input', { type: 'checkbox' });

    function buildProposal(){
      const actions = actionsInput.value.split('\n').map((s) => s.trim()).filter(Boolean);
      const needs = needsInput.value.split('\n').map((s) => s.trim()).filter(Boolean);
      return {
        understanding: understandingInput.value.trim(),
        actions,
        needs,
        caution: cautionInput.value.trim() || null,
        source: sourceSel.value,
      };
    }
    function buildCandidate(){
      if (!candKind.value.trim()) return null;
      let value = candValue.value;
      try { value = JSON.parse(candValue.value); } catch (e) { /* keep as plain text */ }
      const derived_from = candDerived.value.split(',').map((s) => s.trim()).filter(Boolean);
      const sources = [];
      if (candSys.value.trim()) sources.push({ system: candSys.value.trim(), ref: candRef.value.trim() || null, harness: candHarness.checked });
      return { kind: candKind.value.trim(), body: { subject: candSubject.value.trim(), value }, derived_from, sources };
    }

    const previewOut = el('div', { style: 'margin-top:8px' });
    const previewBtn = el('button', { class: 'btn-ghost' }, ['Preview scope']);
    previewBtn.addEventListener('click', async () => {
      if (!laneSel.value) { showError('choose a lane first'); return; }
      const candidate = buildCandidate();
      if (!candidate) { showError('add a candidate kind to preview its scope'); return; }
      const res = await api('/api/fleet/ledger/scope-preview', { method: 'POST', body: { agent: laneSel.value, candidate } });
      clear(previewOut);
      if (!res.ok) return;
      previewOut.appendChild(renderScopeBeat(res));
    });

    const proposeBtn = el('button', { class: 'btn' }, ['Post proposal']);
    proposeBtn.addEventListener('click', async () => {
      if (!laneSel.value) { showError('choose a lane first'); return; }
      const proposal = buildProposal();
      if (!proposal.understanding) { showError('a proposal needs an understanding'); return; }
      if (!proposal.actions.length) { showError('list at least one action'); return; }
      const candidate = buildCandidate();
      proposeBtn.disabled = true;
      const res = await api('/api/fleet/board/' + item.id + '/propose', {
        method: 'POST',
        body: { agent: laneSel.value, proposal, candidate: candidate || undefined },
      });
      proposeBtn.disabled = false;
      if (res.ok) await refreshBoardAndDetail(item.id);
    });

    box.appendChild(el('div', { class: 'form-grid' }, [
      el('div', { class: 'field' }, [el('label', {}, ['lane']), laneSel]),
      el('div', { class: 'field' }, [el('label', {}, ['source']), sourceSel]),
      el('div', { class: 'field full' }, [el('label', {}, ['understanding']), understandingInput]),
      el('div', { class: 'field full' }, [el('label', {}, ['actions']), actionsInput]),
      el('div', { class: 'field full' }, [el('label', {}, ['needs']), needsInput]),

  function modalOverlay(){
    const overlay = el('div', {
      // The overlay scrolls, and its card is capped, so a dialog that grows
      // (a refusal plus the approval step) never runs off the viewport.
      style: 'position:fixed; inset:0; background:rgba(2,6,16,.68); display:flex; align-items:flex-start;'
        + ' justify-content:center; z-index:200; padding:32px 16px; overflow-y:auto',
    });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.remove(); });
    overlay.tabIndex = -1;
    setTimeout(() => overlay.focus(), 0);
    return overlay;
  }

  function renderConsumeView(main){

    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [

      ]),
    ]));

    const subjectInput = el('input', { type: 'text', value: state.consume.subject, placeholder: 'subject' });

      el('option', { value: '' }, ['choose an agent (required)']),
      ...myAgents.map((a) => el('option', { value: a.id, selected: state.consume.agent === a.id }, [a.id])),
    ]);
    const askBtn = el('button', { class: 'btn' }, ['Ask']);

    askBtn.addEventListener('click', async () => {
      if (!agentSel.value) { showError('choose which of your agents is asking'); return; }
      state.consume.kind = kindInput.value.trim();
      state.consume.subject = subjectInput.value.trim();
      state.consume.agent = agentSel.value;
      const q = { agent: agentSel.value };
      if (state.consume.kind) q.kind = state.consume.kind;
      if (state.consume.subject) q.subject = state.consume.subject;
      const params = new URLSearchParams(q).toString();
      const res = await api('/api/fleet/ledger/ask?' + params, { quiet: true });
      if (!res.ok) { showError(res.reason); return; }
      state.consume.result = res;
      state.consume.allOutputsCache = res.answers || [];
      state.consume.selectedOutput = null;
      renderShell();
    });

    const form = el('div', { class: 'card' }, [
      el('div', { class: 'form-grid' }, [
        el('div', { class: 'field' }, [el('label', {}, ['agent (asking on behalf of)']), agentSel]),

        el('div', { class: 'field' }, [el('label', {}, ['subject']), subjectInput]),
      ]),
      el('div', { style: 'margin-top:10px' }, [askBtn]),
    ]);
    main.appendChild(form);

    const result = state.consume.result;
    if (!result) {
      main.appendChild(el('div', { class: 'empty-state' }, ['ask the ledger something to see results']));
      return;
    }

    if (result.conflict) {
      const names = (result.conflicts || []).flatMap((c) => c.outputs).join(', ');
      main.appendChild(el('div', { class: 'conflict-banner' }, [
        el('b', {}, ['Conflict. ']),
        'more than one live answer disagrees on the same kind and subject (' + names + '). The brain surfaces both below and does not pick a winner.',
      ]));
    }

    if (!result.answers.length) {
      main.appendChild(el('div', { class: 'empty-state' }, ['no answers visible to you for this query']));
    }

    result.answers.forEach((a) => {
      const card = el('div', { class: 'answer-card' }, [
        el('div', { class: 'answer-top' }, [
          el('div', {}, [
            el('div', { style: 'font-size:11px; color:var(--ink-faint)' }, [a.kind + (a.subject ? ' · ' + a.subject : '')]),
          ]),
          el('div', { class: 'row' }, [freshnessChip(a.freshness), statusChip(a.status)]),
        ]),
        el('div', { class: 'answer-value' }, [typeof a.value === 'object' ? JSON.stringify(a.value) : String(a.value)]),
        el('div', { class: 'answer-meta' }, ['producer ' + a.producer.fleet + '/' + a.producer.agent + ' · scope ' + a.scope + ' · id ' + a.id]),
      ]);
      if (a.unverified || a.freshness !== 'fresh') {
        card.appendChild(el('div', { class: 'unverified-flag' }, [
          a.unverified ? 'Unverified: no source and no input stands behind this figure. ' : '',
          a.freshness !== 'fresh' ? ('Freshness: ' + a.freshness + '.') : '',
        ]));
      }
      card.addEventListener('click', async () => {
        const res = await api('/api/fleet/ledger/outputs/' + encodeURIComponent(a.id) + '?agent=' + encodeURIComponent(agentSel.value), { quiet: true });
        if (!res.ok) { showError(res.reason); return; }

        renderShell();
      });
      main.appendChild(card);
    });

    if (state.consume.selectedOutput) {
      main.appendChild(renderOutputDetail(state.consume.selectedOutput));
    }

  function refusalGuidance(stage){
    const map = {
      identity: 'nothing to do here: the employee behind this token is not active.',
      registry: 'this target is not invocable, or the connector rejected the call. Consume its outputs instead.',
      access_list: 'request access from Agents.',
      grant: 'request a grant from Agents.',
      rate_limit: 'the target is rate limited. Wait and try again.',
      load_shed: 'the gateway is at capacity. Retry once.',
      approval_required: 'a human has to approve this exact write before it is sent.',
    };
    return map[stage] || 'no guidance available for this stage.';
  }

  function openRequestDialog(catalogItem, myAgents){
    const overlay = modalOverlay();
    const isGrant = catalogItem.on_access_list;
    const agentSel = el('select', {}, [
      el('option', { value: '' }, ['choose an agent']),
      ...myAgents.map((a) => el('option', { value: a.id }, [a.id])),
    ]);
    const justInput = el('textarea', { placeholder: 'one-line justification' });
    const submitBtn = el('button', { class: 'btn' }, ['Send request']);
    submitBtn.addEventListener('click', async () => {
      if (isGrant && !agentSel.value) { showError('choose which agent needs the grant'); return; }
      if (!justInput.value.trim()) { showError('a request needs a justification'); return; }
      submitBtn.disabled = true;
      const body = { type: isGrant ? 'grant_request' : 'access_request', target: catalogItem.id, justification: justInput.value.trim() };
      if (isGrant) body.agent = agentSel.value;
      const res = await api('/api/fleet/requests', { method: 'POST', body });
      submitBtn.disabled = false;
      if (res.ok) { overlay.remove(); await refreshAll(); showError('request sent: see it on the Board, or Access.'); }
    });
    const card = el('div', { class: 'card', style: 'width:460px; max-width:90vw' }, [
      el('h3', {}, [isGrant ? 'Request a grant' : 'Request access'], ),
      el('div', { style: 'font-size:12px; color:var(--ink-faint); margin-bottom:8px' }, ['target: ' + catalogItem.id]),
      isGrant ? el('div', { class: 'field' }, [el('label', {}, ['agent']), agentSel]) : null,
      el('div', { class: 'field' }, [el('label', {}, ['justification']), justInput]),
      el('div', { class: 'row', style: 'margin-top:10px; justify-content:flex-end' }, [
        el('button', { class: 'btn-ghost', onclick: () => overlay.remove() }, ['Cancel']),
        submitBtn,
      ]),
    ]);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  function openWriteInvokeDialog(catalogItem, op){
    const overlay = modalOverlay();
    const argsInput = el('textarea', { placeholder: '{"short_description": "...", "assignment_group": "..."}', style: 'min-height:90px' });
    const stepBox = el('div');

    async function attempt(approval){
      const raw = argsInput.value.trim();
      let args = {};
      if (raw) {
        try { args = JSON.parse(raw); } catch(e) { showError('args must be valid JSON'); return; }
      }
      if (!state.catalog.agent) { showError('choose an agent above the catalog list first'); return; }
      const body = { agent: state.catalog.agent, target: catalogItem.id, op, args };
      if (approval) body.approval = true;
      const res = await api('/api/fleet/gateway/invoke', { method: 'POST', body, quiet: true });
      clear(stepBox);
      if (res.ok) {
        stepBox.appendChild(renderInvokeResult(res));
        await loadContext();
        return;
      }
      stepBox.appendChild(renderInvokeResult(res));
      if (res.stage === 'approval_required' && res.needs_approval) {
        const na = res.needs_approval;
        const approveBox = el('div', { class: 'approval-box' }, [
          el('div', { class: 'section-title' }, ['Exact call requiring your approval']),
          el('pre', {}, [JSON.stringify(na, null, 2)]),
          el('button', { class: 'btn' }, ['Approve and send']),
        ]);
        approveBox.lastElementChild.addEventListener('click', () => attempt(true));
        stepBox.appendChild(approveBox);
      }
    }

    const sendBtn = el('button', { class: 'btn' }, ['Send']);
    sendBtn.addEventListener('click', () => attempt(false));

    const card = el('div', { class: 'card', style: 'width:520px; max-width:92vw' }, [
      el('h3', {}, ['Invoke write op: ' + op + ' on ' + catalogItem.id]),
      el('div', { style: 'font-size:12px; color:var(--ink-faint); margin-bottom:8px' }, ['A write always needs a human approval. You will see the exact call before anything is sent.']),
      el('div', { class: 'field' }, [el('label', {}, ['args (JSON)']), argsInput]),
      el('div', { class: 'row', style: 'margin-top:10px; justify-content:flex-end' }, [
        el('button', { class: 'btn-ghost', onclick: () => overlay.remove() }, ['Close']),
        sendBtn,
      ]),
      stepBox,
    ]);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  /* ================= ACCESS ================= */
  function renderAccessView(main){
    const ctx = state.context;
    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Access']),
        el('div', { class: 'view-sub' }, ['Live, expired and revoked grants held by your fleet, plus your pending tool needs and open platform requests.']),
      ]),
    ]));

    if (!ctx) { main.appendChild(el('div', { class: 'empty-state' }, ['loading'])); return; }

    const grants = ctx.grants || [];
    const grantsCard = el('div', { class: 'card' });
    grantsCard.appendChild(el('div', { class: 'section-title' }, ['Grants']));
    if (!grants.length) {
      grantsCard.appendChild(el('div', { class: 'empty-state' }, ['no grants']));
    } else {
      const wrap = el('div', { class: 'scroll-x' });
      const table = el('table', {}, [
        el('thead', {}, [el('tr', {}, ['subject', 'agent', 'status', 'expires in', 'approved by', 'justification'].map((h) => el('th', {}, [h])))]),
        el('tbody', {}, grants.map((g) => el('tr', {}, [
          el('td', {}, [g.subject_label]),
          el('td', {}, [el('code', {}, [g.agent])]),
          el('td', {}, [g.revoked ? el('span', { class: 'chip chip-red' }, ['revoked']) : g.live ? el('span', { class: 'chip chip-green' }, ['live']) : el('span', { class: 'chip chip-neutral' }, ['expired'])]),
          el('td', {}, [g.live ? (g.expires_in_days + ' days') : '—']),
          el('td', {}, [g.approved_by]),
          el('td', { class: 'wrap' }, [g.justification || '—']),
        ]))),
      ]);
      wrap.appendChild(table);
      grantsCard.appendChild(wrap);
    }
    main.appendChild(grantsCard);

    const tools = ctx.tools || { available: [], pending: [] };
    const toolsCard = el('div', { class: 'card' });
    toolsCard.appendChild(el('div', { class: 'section-title' }, ['Tools available now']));
    if (!tools.available.length) toolsCard.appendChild(el('div', { class: 'empty-state' }, ['none']));
    else {
      const row = el('div', { class: 'row' });
      tools.available.forEach((t) => row.appendChild(el('span', { class: 'chip chip-green' }, [t.name + ' (' + t.class + ')'])));
      toolsCard.appendChild(row);
    }
    toolsCard.appendChild(el('div', { class: 'section-title', style: 'margin-top:14px' }, ['Pending tool needs']));
    if (!tools.pending.length) toolsCard.appendChild(el('div', { class: 'empty-state' }, ['none']));
    else {
      tools.pending.forEach((t) => {
        toolsCard.appendChild(el('div', { class: 'row', style: 'margin-bottom:6px' }, [
          el('span', { class: 'chip chip-amber' }, [t.name]),
          el('span', { style: 'font-size:12px; color:var(--ink-faint)' }, [t.why + ' (needs ' + t.needs + ')']),
        ]));
      });
    }
    main.appendChild(toolsCard);

    const reqCard = el('div', { class: 'card' });
    reqCard.appendChild(el('div', { class: 'section-title' }, ['Open requests to the platform team']));
    const openReqs = (state.board.items || []).filter((i) => i.platform_request);
    if (!openReqs.length) reqCard.appendChild(el('div', { class: 'empty-state' }, ['none yet']));
    else {
      openReqs.forEach((i) => {
        reqCard.appendChild(el('div', { class: 'row-between', style: 'padding:8px 0; border-bottom:1px solid var(--line-soft)' }, [
          el('div', {}, [
            el('div', { style: 'font-weight:600; font-size:13px' }, [i.title]),
            el('div', { style: 'font-size:11px; color:var(--ink-faint)' }, [i.platform_request.type + ' → ' + i.platform_request.target]),
          ]),
          itemStatusChip(i.status),
        ]));
      });
    }
    main.appendChild(reqCard);
  }

  /* ================= CONNECTION ================= */
  async function renderConnectionView(main){
    main.appendChild(el('div', { class: 'view-header' }, [
      el('div', {}, [
        el('h2', {}, ['Connection']),
        el('div', { class: 'view-sub' }, ['The connection descriptor your fleet builder points its own transport at. This repo does not install a transport.']),
      ]),
    ]));

    if (!state.connection) {
      const res = await api('/api/fleet/connection', { quiet: true });
      if (res.ok) state.connection = res.descriptor;
      else { main.appendChild(el('div', { class: 'empty-state' }, [res.reason || 'connection descriptor unavailable'])); return; }
    }

    const text = JSON.stringify(state.connection, null, 2);
    const box = el('div', { class: 'card connection-box' });
    const copyBtn = el('button', { class: 'btn-ghost btn-sm copy-btn' }, ['Copy']);
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); copyBtn.textContent = 'Copied'; setTimeout(() => copyBtn.textContent = 'Copy', 1500); }
      catch(e) { showError('could not copy to clipboard'); }
    });
    box.appendChild(copyBtn);
    box.appendChild(el('pre', {}, [text]));
    main.appendChild(box);

    main.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'section-title' }, ['Endpoints']),
      el('dl', { class: 'kv' }, Object.entries(state.connection.endpoints || {}).flatMap(([k, v]) => [
        el('dt', {}, [k]), el('dd', {}, [el('code', {}, [v])]),
      ])),
      el('div', { class: 'section-title', style: 'margin-top:12px' }, ['Auth']),
      el('div', { style: 'font-size:13px' }, ['scheme: ' + state.connection.auth.scheme + ' · token env var: ', el('code', {}, [state.connection.auth.token_env])]),
      el('div', { style: 'font-size:12px; color:var(--ink-faint); margin-top:4px' }, [state.connection.auth.note]),
    ]));
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    if (!state.token || !state.whoami) { renderSignin(state.signinReason); return; }
    renderShell();
  }

  boot();
})();
</script>
</body>
</html>
